# Generate one random secret and replace REPLACE_ME in both client.toml and
# server.toml before use. Keep that shared secret private.
#
# Linux/macOS: openssl rand -hex 32
# PowerShell:   [guid]::NewGuid().ToString()

log_level = "info"

# The management API is optional, loopback-only, and requires a separate random
# operator token when enabled.
# [management]
# listen = ["127.0.0.1:7600"]
# token = "replace-with-a-random-operator-token"
# dashboard = true

[[inbounds]]
tag = "mpp-listener"
protocol = "mpp"
endpoints = ["tcp://0.0.0.0:7443", "udp://0.0.0.0:7443"]
outbound = "direct-egress"

[inbounds.security]
secret = "REPLACE_ME"

[[outbounds]]
tag = "direct-egress"
protocol = "direct"
