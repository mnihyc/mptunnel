# Generate one random credential into ./mpp-credential.key and transfer that
# file securely to both endpoints. Keep it outside source control.
#
# Linux/macOS: umask 077; openssl rand -out mpp-credential.key 32
# PowerShell:   (New-Guid).Guid | Set-Content -NoNewline mpp-credential.key
# Transport protection uses a different raw 32-byte file shared by the two
# endpoints: umask 077; openssl rand -out mpp-transport.key 32
# Keep the local management token separate and newline-free:
# umask 077; openssl rand -hex 24 | tr -d '\n' > management-token.key

[logging]
level = "info" # all levels are good

[flow]
# TCP streams and UDP associations idle on application payload; 0 disables.
idle_timeout_s = 300
# Optional reliable MPP payload reinjection; control/probes/native recovery are outside it.
optional_reinjection_budget_percent = 10
# Sender-side QUIC loss correction with a bounded 3-round burst envelope; path URI wins.
quic_loss_compensation_percent = 10

[admission]
max_live_flows = 4096
max_concurrent_work = 4096
max_live_flows_per_principal = 4096
max_live_flows_per_outbound = 4096
max_connects_per_outbound = 4096
max_live_flows_per_target = 4096
max_connects_per_target = 4096
max_dns_work = 4096

[management]
# Local authenticated API and embedded diagnostics dashboard.
listen = ["127.0.0.1:7600"]
token = { from = "file", path = "management-token.key" }
dashboard = true
# Incoming peer diagnostics remain endpoint-controlled and denied by default.
allow_peer_diagnostics = false

[[credentials]]
credential_id = "home-client"
principal_id = "home"
secret = { from = "file", path = "mpp-credential.key" }

[[inbounds]]
name = "local-mixed"
protocol = "mixed"
listen = ["127.0.0.1:1080"]

[inbounds.admission]
max_connections = 4096
max_connections_per_source = 4096
max_connections_per_principal = 4096
handshake_timeout_s = 10

# Optional fixed-target TCP+UDP forwarding on one local address and port.
# [[inbounds]]
# name = "local-mixed-forward"
# protocol = "mixed-forward"
# listen = ["127.0.0.1:853"]
# target = "resolver.example:853"

# Optional V2Ray-style `geoip:private` bypass. Its CIDRs intentionally include
# special-use, loopback, link-local, multicast, and documentation space in
# addition to RFC 1918 IPv4 and RFC 4193 IPv6 ULA space. Uncomment this entire
# outbound together with the matching routing rule below only when that broad
# local bypass is intended.
# [[outbounds]]
# name = "private-direct"
# protocol = "direct"

[[outbounds]]
name = "remote-mpp"
protocol = "mpp"
# Endpoint-specific incoming diagnostics permission. A `[management]` table
# with `allow_peer_diagnostics = true` overrides this process-wide.
# allow_peer_diagnostics = false
# Replace server.example.com with the server's reachable name or address.
# TCP and QUIC/UDP remain separate carriers under one logical MPP session.
# QUIC loss compensation inherits performance/[flow]. A path URI overrides it:
# append `?loss-compensation-percent=10` (or `=0` for draft BBR3 behavior).
paths = [
  { name = "path-1", endpoint = "tcp://server.example.com:7443" },
  { name = "path-2", endpoint = "quic://server.example.com:7443" },
]
# performance = { optional_reinjection_budget_percent = 20, quic_loss_compensation_percent = 5 } # overrides [flow]; path URI wins for loss

[outbounds.security]
credential_id = "home-client"
# The pinned certificate uses mptunnel.example unless this is overridden.
# tls_server_name = "mptunnel.example"
tls_pinned_certificate = { from = "file", path = "server-cert.pem" }
# This endpoint-wide secret is not the MPP client credential above.
transport_secret = { from = "file", path = "mpp-transport.key" }
# Direct-paste alternative (`openssl rand -hex 32`); use the same value on both peers:
# transport_secret = { from = "hex", value = "REPLACE_WITH_64_HEX_DIGITS" }

[routing]
target_resolution = "as-is"

# This is the complete CIDR set emitted by V2Fly's `geoip:private` source, not
# only the RFC 1918 ranges. Under `as-is`, it matches literal targets only;
# hostnames remain unchanged and use `remote-mpp`. Uncomment the complete rule
# together with `private-direct` above to opt in.
# [[routing.rules]]
# name = "bypass-v2ray-private-literals"
# inbounds = ["local-mixed"]
# destination_cidrs = [
#   "0.0.0.0/8",
#   "10.0.0.0/8",
#   "100.64.0.0/10",
#   "127.0.0.0/8",
#   "169.254.0.0/16",
#   "172.16.0.0/12",
#   "192.0.0.0/24",
#   "192.0.2.0/24",
#   "192.88.99.0/24",
#   "192.168.0.0/16",
#   "198.18.0.0/15",
#   "198.51.100.0/24",
#   "203.0.113.0/24",
#   "224.0.0.0/4",
#   "240.0.0.0/4",
#   "255.255.255.255/32",
#   "::/128",
#   "::1/128",
#   "fc00::/7",
#   "fe80::/10",
#   "ff00::/8",
# ]
# decision = "allow-restricted"
# outbound = "private-direct"

# Literal targets from the local proxy, including a private VPN DNS endpoint,
# are delegated to the MPP server. This permission applies only to the
# `remote-mpp` hop; the server independently authorizes its actual egress.
[[routing.rules]]
name = "delegate-literal-targets"
inbounds = ["local-mixed"]
destination_cidrs = ["0.0.0.0/0", "::/0"]
decision = "allow-restricted"
outbound = "remote-mpp"

[[routing.rules]]
name = "default"
outbound = "remote-mpp"
