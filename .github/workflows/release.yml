name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Maintainability line-count warning
        run: scripts/check-line-counts.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  package:
    name: package (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            shell: bash
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            shell: bash
          - os: macos-latest
            target: x86_64-apple-darwin
            shell: bash
          - os: macos-latest
            target: aarch64-apple-darwin
            shell: bash
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shell: pwsh
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package Unix
        if: matrix.shell == 'bash'
        shell: bash
        run: scripts/package-release.sh --target "${{ matrix.target }}"
      - name: Package Windows
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: scripts/package-release.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mptunnel-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
