# Exhaustive configuration reference with one runnable common-client profile.
# Active values expose local SOCKS5 and HTTP proxying through one TCP/QUIC MPP
# peer. Commented blocks cover every other supported TOML shape without
# opening extra listeners. Create the referenced credential file, replace the
# example endpoint and TLS material, then run:
#
#   mptunnel --config ./config.toml --check-config
#
# Minimal client and server profiles live in ./examples. Unknown TOML keys are
# rejected. `mptunnel platform` reports host integration support; it is a
# command, not a TOML setting.

check_config = false

# One forwarding family is selected for the complete runtime generation.
# Omission selects L4. L3 is an explicit experimental alternative documented
# in its dedicated section below; the two families cannot be mixed.
# forwarding_mode = "l4"

# Process logging stays outside the forwarding data path. Relative file paths are
# resolved beside this document; parent directories must already exist.
[logging]
level = "info"          # off, error, warn, or info
format = "text"         # text or newline-delimited json
console = true          # standard error
# file = "logs/mptunnel.log"
flow_events = false     # opt-in destination-bearing flow open/close records

# Global credentials use protocol credential and principal identities. Each
# MPP outbound uses `credential_id`; an MPP inbound accepts `credential_ids`.
# File references are resolved relative to this TOML document. Environment
# references use:
# secret = { from = "environment", variable = "MPTUNNEL_HOME_KEY" }.
[[credentials]]
credential_id = "home-client"
principal_id = "home"
secret = { from = "file", path = "mpp-credential.key" }
# expires_at_unix_secs = 1798761600
# revoked = false
# revocation_grace_seconds = 30

# Optional named users for local SOCKS5 and HTTP proxy authentication.
# Login names and passwords are protocol credentials; `principal_id` is the
# stable principal identity used by routing and admission. Passwords are never
# accepted inline.
# [[local_users]]
# name = "phone-login"
# principal_id = "family"
# username = "mobile-user"
# password = { from = "file", path = "local-proxy-password.key" }

[service]
# Supervision owns process generations, never MPP session state.
service_mode = false
supervise = false
restart_backoff_ms = 1000
restart_max_backoff_ms = 30000
# Omit max_restarts for unlimited in-process restart attempts.
max_restarts = 10

[session]
# Established streams survive a complete carrier outage for five minutes.
# The same absolute ceiling bounds graceful TCP carrier retirement.
# Healthy idle streams with an authenticated carrier do not consume it.
retention_timeout_ms = 300000

[management]
# The API is disabled while listen is empty. To enable it, replace listen with
# one or more loopback addresses and reference a separate 16..=256 byte
# visible-ASCII operator-token file. Dashboard serving requires the API; peer
# diagnosis is an independent, symmetric permission for authenticated MPP peers.
listen = []
# token = { from = "file", path = "management-token.key" }
dashboard = false
allow_peer_diagnostics = false
# With a nonempty listener and token, this file is also the operator profile:
#   mptunnel --config ./config.toml status
#   mptunnel --config ./config.toml dns status
#   mptunnel --config ./config.toml dns explain example.com
# `route explain` and `doctor` also load this strict file without starting the
# runtime. See docs/OPERATIONS.md for their typed inputs and exit behavior.

[resources]
# These are bounded capacity envelopes. Live transport metrics choose paths and
# scheduling; these values do not select a fixed latency or bulk mode.
max_frame_bytes = 1048576
max_payload_bytes = 1048512
max_ack_ranges = 256
max_paths = 64
max_streams = 65536
max_quic_concurrent_bidi_streams = 65536
max_stream_window_bytes = 67108864
max_repair_bytes = 67108864
max_reorder_bytes = 67108864
max_reinjection_cache_chunks = 65536
max_reorder_buffer_chunks = 65536
max_retained_receive_ranges = 65536
max_datagram_queue_bytes = 16777216
max_path_flight_bytes = 67108864
max_reliable_relay_chunk_bytes = 524288

# TCP record heartbeats and native QUIC liveness are separate carrier
# mechanisms. The interval is the maximum idle delay; clients renew each idle
# probe within 80%-100% of it. Both remain below logical session retention.
tcp_path_heartbeat_interval_ms = 10000
tcp_path_heartbeat_timeout_ms = 30000
quic_path_keep_alive_interval_ms = 10000
quic_path_idle_timeout_ms = 30000

# New-flow admission is a separate open/control-time owner. These limits do not
# derive from, resize, or feed MPP path/session/stream/queue budgets.
# Established permits do no per-byte or per-packet accounting.
[admission]
max_live_flows = 4096
max_concurrent_work = 512
max_live_flows_per_principal = 1024
max_live_flows_per_outbound = 3072
max_connects_per_outbound = 256
max_live_flows_per_target = 256
max_connects_per_target = 32
max_dns_work = 128

# DNS is one global named policy. Routes and MPP server inbounds may select a
# DNS plan by name; exact rules win over the longest matching suffix, then
# default.
[dns]
generation = 1
default_dns_plan = "system"
# There is never an implicit host-resolver escape path. Define a named
# `transport = "system"` upstream explicitly when that behavior is wanted.

[[dns.upstreams]]
name = "system"
transport = "system" # system, udp, tcp, udp-tcp, tls, https, or quic

[[dns.plans]]
name = "system"
upstreams = ["system"]
ip_strategy = "ipv4-and-ipv6" # ipv4-only, ipv6-only, ipv4-then-ipv6,
# ipv6-then-ipv4, ipv4-and-ipv6, or ipv6-and-ipv4
security = "allow-plaintext"
upstream_strategy = "ordered"
# For plans with at least two upstreams, use `upstream_strategy = "race"` and
# set `fallback_delay_ms` (zero races all upstreams immediately).
# fallback_delay_ms = 50
expected_cidrs = []
lookup_timeout_ms = 5000
cache_capacity = 4096
max_inflight = 64
max_answers = 64
positive_ttl_cap_ms = 300000
negative_ttl_cap_ms = 30000
stale_if_error_ms = 30000
prefetch_max_ms = 30000

# Encrypted upstream example. `bootstrap` is always a literal IP socket;
# `server_name` authenticates TLS and is also the DoH authority. Custom DoH
# ports are preserved. Use `transport = "tls"` for DoT or
# `transport = "quic"` for DoQ (both without `path`). Direct and source-bound
# leaves support DoQ; stream proxy/MPP DNS egress supports TCP/DoT/DoH.
# [[dns.upstreams]]
# name = "secure"
# transport = "https"
# bootstrap = "1.1.1.1:443"
# server_name = "cloudflare-dns.com"
# path = "/dns-query"
# outbound = "edge-mpp"
#
# `outbound` is optional. When present, DNS TCP/DoT/DoH uses that
# named MPP, SOCKS5, HTTP CONNECT, HTTPS CONNECT, or direct leaf. DoQ and
# plaintext UDP require a native direct/source-bound leaf.
#
# [[dns.plans]]
# name = "secure"
# upstreams = ["secure"]
# security = "require-encrypted"
#
# FakeDNS applies only to captured A/AAAA wire queries. Dial-time resolution
# still obtains real addresses from the selected plan. Synthetic addresses are
# never reassigned to another domain in one generation; expired/unknown
# recovery fails closed. IPv4 must be inside 198.18.0.0/15 and IPv6 inside
# fc00::/7 so a fake pool cannot shadow public destinations. Managed split VPN
# includes must cover every configured pool and excludes may not overlap one;
# an external/manual TUN operator owns the equivalent routes.
# [dns.fake_dns]
# ipv4_pool = "198.18.0.0/16"
# ipv6_pool = "fd00:4d50::/112"
# max_entries = 4096
# answer_ttl_ms = 30000
# recovery_ttl_ms = 120000
#
# [[dns.rules]]
# name = "private-host"
# exact = "router.corp.example"
# dns_plan = "system"
# explanation = "private host uses the host resolver"
#
# [[dns.rules]]
# name = "private-zone"
# suffix = "corp.example" # Exactly one of exact or suffix.
# dns_plan = "system"
#
# Exact immutable host overrides never leak unmatched record types upstream.
# [[dns.hosts]]
# domain = "router.home.arpa"
# addresses = ["192.168.1.1", "fd00::1"]

# One listener may accept both proxy protocols by using `protocol = "mixed"`;
# it shares the same `local_users` and admission policy and defaults to IPv4
# loopback port 1080. HTTP supports CONNECT tunnels and one absolute-form
# cleartext request per connection; the proxy rewrites it to origin-form,
# strips proxy credentials and hop-by-hop headers, and supports fixed
# Content-Length bodies (not Transfer-Encoding). The separate listeners below
# document each dedicated protocol form.
# [[inbounds]]
# name = "local-mixed"
# protocol = "mixed"
# listen = ["127.0.0.1:1080"]
# local_users = ["phone-login"]
#
[[inbounds]]
name = "local-socks"
protocol = "socks5"
# Repeat addresses for explicit IPv4/IPv6 listeners, for example
# listen = ["127.0.0.1:1080", "[::1]:1080"]. An empty list defaults to IPv4
# loopback port 1080.
listen = ["127.0.0.1:1080"]
# New flows are assigned by the ordered rules in `[routing]` below.
# local_users = ["phone-login"]

[inbounds.admission]
# Connection-open limits; these do not derive from MPP resource limits.
max_connections = 1024
max_connections_per_source = 256
max_connections_per_principal = 512
handshake_timeout_ms = 10000

[[inbounds]]
name = "local-http"
protocol = "http-connect"
# Despite the compatibility name, this accepts CONNECT and absolute-form
# cleartext HTTP requests. An empty list defaults to IPv4 loopback port 8080.
listen = ["127.0.0.1:8080"]
# local_users = ["phone-login"]

# Optional fixed-target local port forwards. Unlike proxy listeners, `listen`
# and `target` are required and port zero is rejected. Each accepted flow uses
# the normal routing, DNS, destination-ACL, outbound, and balancer pipeline.
#
# [[inbounds]]
# name = "local-tcp-forward"
# protocol = "tcp-forward"
# listen = ["127.0.0.1:8443"]
# target = "service.example:443"
# max_connections = 1024
#
# [[inbounds]]
# name = "local-udp-forward"
# protocol = "udp-forward"
# listen = ["127.0.0.1:5353"]
# target = "resolver.example:53"
# max_associations = 1024
# idle_timeout_ms = 60000
# datagram_ttl_ms = 30000

# Experimental TUN-L4 ingress. It uses the same routing policy as local proxy
# inbounds. Omitting `host` is explicit external/manual mode: MPTUNNEL opens
# the device, while the operator owns host routes and DNS.
# [[inbounds]]
# name = "local-tun"
# protocol = "tun"
# interface_name = "mptun0"
# ipv4 = "10.88.0.1"
# disable_ipv4 = false
# ipv4_prefix = 24
# ipv4_gateway = "10.88.0.254"
# ipv6 = "fd00:88::1"
# ipv6_prefix = 64
# mtu = 1500
# disable_icmp = false
# dns_resolvers = ["1.1.1.1:53", "[2606:4700:4700::1111]:53"]
# dns_ttl_ms = 5000
#
# To run IPv6-only, set disable_ipv4 = true and remove ipv4 and ipv4_gateway.
# At least one IP family is required; IPv6 requires an MTU of at least 1280.
#
# On a supported host MPTUNNEL can instead own the interface, routes, endpoint
# bypass, DNS publication, and cleanup transactionally. Full mode requires at
# least one local DNS capture address and an encrypted, non-system DNS plan.
# `dns_resolvers` and `ipv4_gateway` are external/manual fields and must remain
# unset in this mode. Android `VpnService` lifecycle stays host-provided and
# therefore uses external mode.
#
# [inbounds.host]
# mode = "managed"
# route_mode = "full" # Or "split" with nonempty include_cidrs.
# include_cidrs = []
# exclude_cidrs = []
# local_lan = true
# dns_capture_servers = ["10.88.0.53", "fd00:88::53"]
#
# Optional Linux-only RPDB tuning is nested below the portable VPN policy.
# Omit this table for validated platform defaults.
# [inbounds.host.linux]
# route_table = 51820
# native_rule_priority = 9999
# capture_rule_priority = 10000
# socket_mark = 0x4d505455

# Experimental L3 forwarding family (alternative profile)
#
# Set `forwarding_mode = "l3"` at the document root and remove every L4 local
# inbound. Unlike `protocol = "tun"`, this mode does not enter L4 routing or
# terminate inner TCP/UDP flows. The server assigns the interface address after
# MPP authentication; this process opens only the packet device. Host routes,
# DNS, firewall policy, forwarding, and NAT remain external. The selected
# outbound must be MPP and may use both TCP and QUIC.
# [[inbounds]]
# name = "site-tunnel"
# protocol = "tun-l3"
# outbound = "edge-mpp"
# interface_name = "mptun-l3"

[[outbounds]]
name = "edge-mpp"
protocol = "mpp"
# TCP and QUIC/UDP remain independent carriers under one MPP session.
paths = [
  { name = "path-1", endpoint = "tcp://server.example.com:7443" },
  { name = "path-2", endpoint = "udp://server.example.com:7443" },
]
# IPv6 literals use brackets: tcp://[2001:db8::10]:7443.
# Outbound carriers may use one inclusive nonzero ascending port interval:
# tcp://server.example.com:7000-7999 or
# udp://[2001:db8::10]:7000-7999. One concrete port is selected for each new
# physical carrier and remains fixed across that establishment's DNS and
# address-family attempts. Proxy, DNS, target, and management endpoints remain
# single-port. Server MPP bind paths also require one fixed port; every
# externally published range port must be redirected or forwarded to that
# listener.
#
# Ranged QUIC paths periodically move the same authenticated connection to
# another port in the set. Ranged TCP paths use the same interval for ordered
# replacement at an exact active-work quiescent boundary. The default is five
# minutes; override it with
# `port-hop-interval-ms=<u32>` (minimum 5000). TCP never migrates native state
# or closes an active carrier to meet an interval.
#
# Carrier URI query reference (startup hints are replaced by live evidence;
# policy flags remain operator constraints):
#   source-ip=<IP>
#   srtt-ms=<u32>
#   jitter-ms=<u32>
#   rate-bps|rate-kbps|rate-mbps=<u64>, or rate=unknown|unlimited
#   datagram-payload-limit=512..65000
#   tcp-carriers=MIN-MAX (tcp:// only; default 1-3; MIN is obsolete/ignored)
#   port-hop-interval-ms=5000..4294967295 (ranged tcp:// or udp://)
#   backup, expensive, bulk-allowed, probe-only, no-udp
# Boolean flags may omit a value or use canonical true/false. Server bind
# paths reject `source-ip`, `tcp-carriers`, and port ranges; udp:// paths cannot
# set no-udp=true.
path_probe_interval_ms = 10000
path_probe_timeout_ms = 2000

[outbounds.performance]
# Optional repair traffic is evidence-gated and capped by this operator budget.
extra_traffic_hint_percent = 5

[outbounds.security]
credential_id = "home-client"
# The pinned QUIC and TLS-fallback TCP certificate identity is independent from
# the MPP credential. Its default is mptunnel.example; the carrier endpoint may
# be a different DNS name or a literal IP address.
# tls_server_name = "mptunnel.example"
tls_pinned_certificate_file = "REPLACE_WITH_SERVER_CERT.pem"
# Endpoint-wide transport protection uses the same raw 32-byte file on both
# peers. This key is separate from every MPP client credential. Omit the field
# only when both peers use TLS 1.3 TCP and public QUIC Initials instead.
transport_secret_file = "mpp-transport.key"
auth_freshness_window_seconds = 300

[routing]
generation = 1

# Destination policy is independent from route selection and runs before and,
# when this node has or requires IP evidence, after resolution. Restricted
# address space is denied unless an explicit matching rule uses
# `allow-restricted`. Domain-capable outbounds otherwise delegate resolution to
# the configured upstream trust boundary.
# [routing.destination_acl]
#
# [[routing.destination_acl.rules]]
# name = "allow-home-service"
# effect = "allow-restricted" # deny, allow, or allow-restricted
# domain_exact = ["router.home.arpa"]
# domain_suffix = ["home.arpa"]
# domain_keyword = ["router"]
# domain_regex = ["^router[0-9]+\\.home\\.arpa$"]
# destination_cidrs = ["192.168.1.0/24"]
# destination_ports = [443]
# networks = ["tcp"]
# stages = ["pre-resolution", "post-resolution"]

# Route fields are strict and match only attributes available on every live
# ingress: domain exact/suffix/keyword/regex or signed domain sets,
# destination/source CIDRs, destination/source ports, TCP/UDP, named inbound,
# principal ID, and pre/post-resolution stage. Nonempty categories are ANDed;
# values inside one category are ORed. Unknown fields fail configuration load.
#
# Optional signed domain/GeoIP rule sets are loaded and verified as one atomic
# routing generation. Publisher keys are public Ed25519 keys encoded as base64.
# Every set pins its signed ID, publisher, and minimum accepted revision so an
# otherwise valid older artifact cannot be substituted during reload.
#
# [[routing.rule_set_publishers]]
# publisher_id = "official"
# ed25519_public_key_base64 = "REPLACE_WITH_32_BYTE_ED25519_PUBLIC_KEY_BASE64"
#
# [[routing.rule_sets]]
# rule_set_id = "geo-public"
# publisher_id = "official"
# minimum_revision = 42
# file = "rules/geo-public.ruleset.json"
#
# Rule-set domains are ORed with a rule's explicit domain fields; rule-set
# networks are ORed with `destination_cidrs`. The two categories remain ANDed
# with every other nonempty match category.
# [[routing.rules]]
# name = "signed-policy"
# domain_exact = ["service.example"]
# domain_suffix = ["example"]
# domain_keyword = ["service"]
# domain_regex = ["^service[0-9]+\\.example$"]
# domain_rule_set_ids = ["geo-public"]
# destination_cidrs = ["203.0.113.0/24"]
# destination_rule_set_ids = ["geo-public"]
# source_cidrs = ["10.0.0.0/8"]
# destination_ports = [443, "8000-8999"]
# source_ports = [1024, "49152-65535"]
# networks = ["tcp", "udp"]
# inbounds = ["local-socks"]
# principal_ids = ["family"]
# stages = ["post-resolution"]
# action = "outbound" # outbound, balancer, reject, or drop
# outbound = "edge-mpp"
# balancer = "edge-balancer" # Alternative to outbound with action = "balancer".
# dns_plan = "system"
# initial_demand = "throughput" # automatic (default) or throughput
# explanation = "route signed domain and network policy through the edge"

[[routing.rules]]
name = "default"
action = "outbound"
outbound = "edge-mpp"
explanation = "route local proxy traffic through the primary MPP outbound"

# A second independent MPP leaf can join the edge-balancer routing example
# below; it keeps its own session, carrier set, and performance policy.
# [[credentials]]
# credential_id = "secondary-client"
# principal_id = "secondary"
# secret = { from = "file", path = "secondary-mpp-credential.key" }
#
# [[outbounds]]
# name = "edge-mpp-secondary"
# protocol = "mpp"
# paths = [
#   { name = "path-1", endpoint = "tcp://secondary.example.com:7443?backup=true&expensive=true" },
#   { name = "path-2", endpoint = "udp://secondary.example.com:7443?backup=true&expensive=true" },
# ]
# path_probe_interval_ms = 10000
# path_probe_timeout_ms = 2000
#
# [outbounds.performance]
# extra_traffic_hint_percent = 5
#
# [outbounds.security]
# credential_id = "secondary-client"
# tls_server_name = "secondary.example.com"
# tls_pinned_certificate_file = "secondary-server-cert.pem"
# transport_secret_file = "secondary-mpp-transport.key"
# auth_freshness_window_seconds = 300

# Optional server-side MPP inbound
#
# Uncomment this block and one egress below to run a symmetric node. An MPP
# inbound selects one native egress leaf with `outbound`, or one native
# `balancer`. It cannot select an MPP outbound or set both references.
# [[inbounds]]
# name = "mpp-listener"
# protocol = "mpp"
# paths = [
#   { name = "path-1", endpoint = "tcp://0.0.0.0:7443" },
#   { name = "path-2", endpoint = "udp://0.0.0.0:7443" },
# ]
# outbound = "direct-egress"
# balancer = "egress-fallback" # Alternative: remove outbound before enabling.
# dns_plan = "system"
#
# [inbounds.performance]
# extra_traffic_hint_percent = 5
#
# [inbounds.security]
# credential_ids = ["home-client"]
# tls_certificate_chain_file = "server-cert.pem"
# tls_private_key_file = "server-key.pem"
# transport_secret_file = "mpp-transport.key"
# auth_freshness_window_seconds = 300
# authentication_timeout_ms = 5000
# Independently caps authentication work and silent Noise-rejection retention.
# max_pending_authentications = 1024
#
# Experimental server-owned L3 address plan. It is valid only when the document
# selects `forwarding_mode = "l3"`; reliable-stream and application-datagram
# forwarding admission is then unavailable. Pools validate explicit stable
# principal allocations; they are never learned from source IP addresses. One
# live logical tunnel per principal is retained, and a new authenticated session
# supersedes its previous attachment set. Additional `allowed_ips` are routed to
# that principal only when the host has independently installed the corresponding
# route/forwarding policy.
# [inbounds.tun_l3]
# interface_name = "mptun-l3-server"
# ipv4_pool = "10.89.0.0/24"
# ipv4 = "10.89.0.1"
# ipv6_pool = "fd89::/64"
# ipv6 = "fd89::1"
# mtu = 1500
#
# [[inbounds.tun_l3.allocations]]
# principal_id = "home"
# ipv4 = "10.89.0.2"
# ipv6 = "fd89::2"
# allowed_ips = ["192.168.50.0/24"]
#
# Server-side destination policy is scoped to this MPP inbound. Restricted
# addresses are denied whenever this node has IP evidence. A domain delegated
# unchanged to a proxy is resolved by that trusted upstream; add an applicable
# IP or post-resolution rule when this node must enforce addresses first.
# [inbounds.destination_acl]
# generation = 1
#
# [[inbounds.destination_acl.rules]]
# name = "allow-private-service"
# effect = "allow-restricted"
# domain_exact = ["service.corp.example"]
# domain_suffix = ["corp.example"]
# domain_keyword = ["service"]
# domain_regex = ["^service[0-9]+\\.corp\\.example$"]
# destination_cidrs = ["10.0.0.0/8"]
# destination_ports = [443, "8000-8999"]
# networks = ["tcp", "udp"]
# stages = ["pre-resolution", "post-resolution"]
#
# Force address evidence for otherwise unrestricted public targets:
# [[inbounds.destination_acl.rules]]
# name = "require-address-evidence"
# effect = "allow"
# stages = ["post-resolution"]

# Server egress leaves
#
# Direct egress needs an IP target and obtains domain addresses through the DNS
# plan selected by the route or accepting MPP inbound. That plan may use a
# system, direct, or routed remote resolver upstream. Omit bind_ip to let the
# OS select a source address; set it to bind all target and selected DNS
# connections to one local source IP.
# [[outbounds]]
# name = "direct-egress"
# protocol = "direct"
# bind_ip = "192.0.2.10"
# connect_timeout_ms = 10000
#
# Relay through SOCKS5. TCP CONNECT and UDP ASSOCIATE are supported when the
# upstream implements them. A canonical domain is normally carried to the
# proxy for upstream resolution. Routing or destination policy that needs IP
# evidence first resolves through the selected DNS plan and carries the
# authorized literal instead.
# [[outbounds]]
# name = "socks5-egress"
# protocol = "socks5"
# endpoint = "127.0.0.1:1080"
# connect_timeout_ms = 10000
#
# [outbounds.auth]
# username = "upstream-user"
# password = { from = "file", path = "upstream-proxy-password.key" }
#
# Plain HTTP CONNECT carries TCP targets and supports the same referenced
# authentication table. It preserves a canonical domain unless routing or
# destination policy requires authorized IP evidence.
# [[outbounds]]
# name = "http-egress"
# protocol = "http-connect"
# endpoint = "127.0.0.1:8080"
# connect_timeout_ms = 10000
#
# HTTPS CONNECT authenticates the upstream proxy with WebPKI. An optional CA
# file adds private roots; it does not disable hostname verification.
# [[outbounds]]
# name = "https-egress"
# protocol = "https-connect"
# endpoint = "127.0.0.1:8443"
# tls_server_name = "proxy.example.com"
# tls_ca_certificate_file = "private-proxy-ca.pem"
# connect_timeout_ms = 10000
#
# [outbounds.auth]
# username = "upstream-user"
# password = { from = "file", path = "upstream-proxy-password.key" }

# Routing policies
#
# Local SOCKS5/HTTP/TUN rules may select an MPP balancer. An MPP inbound may
# instead select a native-egress balancer. Balancers contain leaf outbounds
# only and cannot be nested.
# [routing]
#
# An MPP balancer chooses one independent MPP outbound once per new flow. It
# never merges carrier paths from separate sessions. Selection uses only
# end-to-end probe/open/flow outcomes; it cannot inspect per-carrier MPP
# scheduler state or carrier metrics.
# [[routing.balancers]]
# name = "edge-balancer"
# strategy = "least-latency"
# manual_outbound = "edge-mpp"
# Old latency remains observable but stops ranking after this age.
# freshness_ttl_ms = 30000
# members = [
#   { outbound = "edge-mpp", weight = 3, mode = "enabled" },
#   { outbound = "edge-mpp-secondary", weight = 1, mode = "enabled" },
# ]
# health = { failure_threshold = 3, recovery_threshold = 2, initial_backoff_ms = 1000,
#            maximum_backoff_ms = 60000 }
# stickiness = { key = "destination", ttl_ms = 60000, capacity = 4096 }
# probe = { target = "192.0.2.1:443", interval_ms = 10000, timeout_ms = 2000 }
#
# `ordered-failover` tries enabled members in configured order. Retry occurs
# only before flow commit. Each attempted TCP/native UDP member retains its own
# outbound stage timeout. The first selected IP-only member may trigger one
# flow-level lookup bounded by the selected DNS plan; failure skips later
# IP-only members without re-querying, so one blackhole cannot consume a
# successor's budget.
# [[routing.balancers]]
# name = "egress-fallback"
# strategy = "ordered-failover"
# members = [{ outbound = "direct-egress" }, { outbound = "socks5-egress" }]
#
# Strategies are `manual`, `ordered-failover`, `round-robin`, `random`,
# `weighted-random`, `least-latency`, and `least-load`. `manual` requires
# `manual_outbound`. `manual_outbound` on an automatic strategy is an initial
# operator pin that can be cleared through the management action API.
#
# Stickiness keys are `destination` and `principal`. Member modes are
# `enabled`, `draining`, and `disabled`; draining and disabled members receive
# no new flows. An active probe target must be a literal IP authority and every
# member of that balancer must support TCP. Probes are globally bounded and
# separately accounted from user flows. After a target connection or datagram
# association commits, MPTUNNEL reports its outcome but never transparently
# replays the flow through another balancer member.
