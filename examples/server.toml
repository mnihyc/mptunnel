# Generate one random credential into ./mpp-credential.key and transfer that
# file securely to both endpoints. Keep it outside source control.
#
# Linux/macOS: umask 077; openssl rand -out mpp-credential.key 32
# PowerShell:   (New-Guid).Guid | Set-Content -NoNewline mpp-credential.key
# Transport protection uses a different raw 32-byte file shared by the two
# endpoints: umask 077; openssl rand -out mpp-transport.key 32

[logging]
level = "info" # all levels are good

[flow]
# TCP streams and UDP associations idle on application payload; 0 disables.
idle_timeout_s = 300
# Optional reliable MPP payload reinjection; control/probes/native recovery are outside it.
optional_reinjection_budget_percent = 10
# Sender-side QUIC loss correction with a bounded 3-round burst envelope; path URI wins.
quic_loss_compensation_percent = 10

[admission]
max_live_flows = 4096
max_concurrent_work = 4096
max_live_flows_per_principal = 4096
max_live_flows_per_outbound = 4096
max_connects_per_outbound = 4096
max_live_flows_per_target = 4096
max_connects_per_target = 4096
max_dns_work = 4096

[[credentials]]
credential_id = "home-client"
principal_id = "home"
secret = { from = "file", path = "mpp-credential.key" }

[[inbounds]]
name = "mpp-listener"
protocol = "mpp"
# QUIC loss compensation inherits performance/[flow]. A path URI overrides it:
# append `?loss-compensation-percent=10` (or `=0` for draft BBR3 behavior).
paths = [
  { name = "path-1", endpoint = "tcp://0.0.0.0:7443" },
  { name = "path-2", endpoint = "quic://0.0.0.0:7443" },
]
# performance = { optional_reinjection_budget_percent = 20, quic_loss_compensation_percent = 5 } # overrides [flow]; path URI wins for loss
# Omission denies incoming peer diagnostics. Use a concrete list of accepted
# principal IDs, or the scalar "*" for every authenticated principal.
# peer_diagnostics_principal_ids = ["home"]

[inbounds.security]
credential_ids = ["home-client"]
tls_certificate_chain = { from = "file", path = "server-cert.pem" }
tls_private_key = { from = "file", path = "server-key.pem" }
# This endpoint-wide secret is not an MPP client credential.
transport_secret = { from = "file", path = "mpp-transport.key" }
# Direct-paste alternative (`openssl rand -hex 32`); use the same value on both peers:
# transport_secret = { from = "hex", value = "REPLACE_WITH_64_HEX_DIGITS" }

[[outbounds]]
name = "direct-egress"
protocol = "direct"
# Omit all bind fields for OS-selected IPv4 and IPv6 sources. Legacy bind_ip is
# single-family and cannot be combined with bind_ipv4 or bind_ipv6.
# bind_ip = "192.0.2.10"
# Prefer one or both explicit-family fields; only configured families are then
# eligible. A temporarily absent address fails a dial, not the node process.
# bind_ipv4 = "192.0.2.10"
# bind_ipv6 = "2001:db8::10"
# Replace the global `system` server with named UDP/TCP/DoT/DoH/DoQ servers
# for explicit or encrypted resolution.

# Optional explicit DNS policies. With this whole block commented, MPTUNNEL
# uses its implicit operating-system resolver and default policy. Uncomment it
# as one block, then set `default = "plain"` to select the UDP-with-TCP-fallback
# alternative instead.
# [dns]
# default = "system"
#
# [[dns.servers]]
# name = "system"
# protocol = "system"
#
# [[dns.servers]]
# name = "plain-udp-tcp"
# protocol = "udp-tcp"
# address = "1.1.1.1:53"
#
# [[dns.policies]]
# name = "system"
# servers = ["system"]
#
# [[dns.policies]]
# name = "plain"
# servers = ["plain-udp-tcp"]

# To relay through SOCKS5, change the routing rule below to
# `outbound = "socks5-egress"`, then uncomment this complete block.
# [[outbounds]]
# name = "socks5-egress"
# protocol = "socks5"
# endpoint = "127.0.0.1:1080"
# connect_timeout_s = 10
# With `full-resolve` below, SOCKS5 receives an authorized literal IP. Use
# `route-only` to retain the canonical hostname after local routing evidence,
# or `as-is` to skip routing DNS entirely.

# Plain HTTP CONNECT relays TCP. Use SOCKS5 when a proxy must relay
# both TCP and UDP.
# [[outbounds]]
# name = "http-egress"
# protocol = "http-connect"
# endpoint = "127.0.0.1:8080"
# connect_timeout_s = 10

[routing]
target_resolution = "full-resolve"

# To permit a private/internal destination, add a narrow rule before the
# default. `allow-restricted` is the explicit authorization; a plain `allow`
# still rejects restricted addresses when they become known.
# [[routing.rules]]
# name = "allow-home-network"
# inbounds = ["mpp-listener"]
# principal_ids = ["home"]
# Replace the sample ULA /48 with the prefix assigned to your internal network.
# destination_cidrs = ["192.168.0.0/16", "fd12:3456:789a::/48"]
# decision = "allow-restricted"
# outbound = "direct-egress"

[[routing.rules]]
name = "default"
outbound = "direct-egress"

# For ordered direct-to-relay fallback, uncomment the SOCKS5 block, replace
# the default rule's `outbound` with `balancer = "egress-fallback"`, and
# uncomment this balancer block. A rule must not set both references.
# [[routing.balancers]]
# name = "egress-fallback"
# strategy = "ordered-failover"
# members = [{ outbound = "direct-egress" }, { outbound = "socks5-egress" }]
# health = { failure_threshold = 3, recovery_threshold = 2, initial_backoff_s = 1, maximum_backoff_s = 60 }
# probe = { target = "192.0.2.1:443", interval_s = 10, timeout_s = 2 }
