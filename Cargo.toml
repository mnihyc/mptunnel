[package]
name = "mptunnel"
version = "0.1.7"
authors = ["mnihyc"]
edition = "2024"
description = "Encrypted multipath proxy and tunnel"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mnihyc/mptunnel"
publish = false
rust-version = "1.96"
keywords = ["multipath", "proxy", "quic", "tunnel"]
categories = ["network-programming"]

[features]
default = []
lab-diagnostics = []

[dependencies]
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.2"
h2 = "0.4"
h3 = { version = "=0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "=0.0.10"
hmac = "0.12"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
httparse = "1.10"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "tls-ring", "quic-ring", "webpki-roots"] }
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
http = "1"
idna = "1.1"
ipnet = "2.11"
netstack-smoltcp = "0.2.4"
percent-encoding = "2.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "=0.11.16", default-features = false }
regex = { version = "1.12", default-features = false, features = ["perf", "std", "unicode-case"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.15"
socket2 = "0.6"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
tun-rs = { version = "2.8.5", features = ["async", "async_framed"] }
uuid = { version = "1.23", default-features = false }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
route_manager = "0.2.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
route_manager = "0.2.11"

[dev-dependencies]
rcgen = "0.14"

[patch.crates-io]
quinn-proto = { path = "crates/quinn-proto" }
