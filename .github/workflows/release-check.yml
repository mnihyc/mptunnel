name: Release Check

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Stable tag to validate without publishing
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Source quality
    uses: ./.github/workflows/release-quality-gate.yml

  version:
    name: Version and published releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate candidate
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > known-tags.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
            --jq '.[].ref | sub("^refs/tags/"; "")' >> known-tags.txt
          sort -u -o known-tags.txt known-tags.txt
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python3 .github/scripts/check-release-version-gate.py \
            --candidate-tag "$CANDIDATE_TAG" \
            --package-version "$package_version" \
            --known-tags-file known-tags.txt

  package:
    name: Package ${{ matrix.target }}
    needs: [quality, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            kind: musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            kind: unix
          - os: ubuntu-24.04
            target: aarch64-linux-android
            kind: android
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install musl C compiler
        if: matrix.kind == 'musl'
        shell: bash
        env:
          CC_ENV: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'x86_64_unknown_linux_musl' || 'aarch64_unknown_linux_musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${CC_ENV}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        if: matrix.kind == 'android'
        shell: bash
        run: |
          ndk_version="27.3.13750724"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;${ndk_version}"
          toolchain="${ANDROID_HOME}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="${toolchain}/aarch64-linux-android21-clang"
          test -x "$cc"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=${toolchain}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Run native platform tests
        if: matrix.kind == 'windows' || matrix.kind == 'unix'
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.kind != 'windows'
        shell: bash
        run: scripts/package-release.sh --target "${{ matrix.target }}"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: pwsh
        run: scripts/package-release.ps1 -Target "${{ matrix.target }}"

      - name: Require static musl linkage
        if: matrix.kind == 'musl'
        shell: bash
        run: file target/${{ matrix.target }}/release/mptunnel | grep -E 'statically linked|static-pie linked'

      - name: Upload package proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  inventory:
    name: Merged release inventory
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download package proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksums and exact asset set
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          while IFS= read -r checksum; do
            (cd artifacts && sha256sum --check "$(basename "$checksum")")
          done < <(find artifacts -maxdepth 1 -type f -name '*.sha256' | sort)

          version="${CANDIDATE_TAG#v}"
          targets=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
            x86_64-apple-darwin
            aarch64-apple-darwin
            aarch64-linux-android
          )
          : > expected-assets.txt
          for target in "${targets[@]}"; do
            extension="tar.gz"
            if [[ "$target" == *windows* ]]; then extension="zip"; fi
            archive="mptunnel-${version}-${target}.${extension}"
            printf '%s\n%s\n' "$archive" "${archive}.sha256" >> expected-assets.txt
          done
          sort -o expected-assets.txt expected-assets.txt
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
