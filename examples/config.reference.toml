# Exhaustive configuration reference with one runnable common-client profile.
# Active values expose local SOCKS5 and HTTP CONNECT through one TCP/QUIC MPP
# peer. Commented blocks cover every other supported TOML shape without
# opening extra listeners. Create the referenced credential and transport-secret
# files, replace the example endpoint and TLS material, then run:
#
#   mptunnel --config ./config.toml --check-config
#
# Minimal client and server profiles live in ./examples. Unknown TOML keys are
# rejected. `mptunnel platform` reports host integration support; it is a
# command, not a TOML setting.
#
# Vocabulary used throughout this reference:
# - target: the application destination requested by a client;
# - listen address: a local socket on which MPTUNNEL accepts traffic;
# - endpoint: a proxy connector or MPP carrier URI;
# - path: one named TCP or QUIC carrier configuration in an MPP session;
# - DNS server: one named DNS transport and its connection settings;
# - DNS policy: server selection, address-family behavior, limits, and cache;
# - DNS override record: one named exact static domain-to-address answer;
# - DNS synthetic capture: one named bounded address pool that can recover the
#   original queried domain when a captured flow opens;
# - outbound: a named connector used for application traffic or routed DNS.

check_config = false
# Prefer the `--check-config` command-line flag for one-time validation. This
# persistent field exists for service integrations that can only supply a file.

# Process logging stays outside the forwarding data path. Relative file paths are
# resolved beside this document; parent directories must already exist.
[logging]
level = "info"          # off, error, warn, info, or debug
format = "text"         # text or newline-delimited json
console = true          # standard error
# file = "logs/mptunnel.log"
flow_events = false     # opt-in destination-bearing flow open/close records
# `debug` adds a concise, correlated trace for each routed L4 connection or UDP
# association: inbound acceptance/establishment, route selection, optional
# balancer choice, and each configured outbound attempt. It does not
# log packets, DNS/probe work, or physical MPP carrier internals.

# Every secret, password, certificate, and key uses one byte-material source.
# A source is resolved once when the configuration is loaded. No
# source trims whitespace or line endings. Both `path` and a relative path read
# from `var` resolve beside this document. `env` reads the file whose path is
# stored in the named environment variable; the variable never contains the
# material itself. `var` must contain only ASCII letters, digits, or underscore
# and cannot be empty.
# File and env-file contents are always literal bytes: a file containing hex
# text is not decoded. Use `from = "hex"` when the pasted value is hexadecimal.
# Hex accepts only `[0-9A-Fa-f]`, has no `0x` prefix or whitespace, and must
# have an even number of digits. Base64 is strict padded RFC 4648 Base64 (`+/`,
# not the URL alphabet) with no whitespace. Raw values are TOML UTF-8 text; omitting
# `from` when `value` is present is identical to `from = "raw"`.
# secret = { from = "file", path = "mpp-credential.key" }
# secret = { from = "env", var = "MPTUNNEL_HOME_KEY_FILE" }
# secret = { from = "hex", value = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f" }
# secret = { from = "base64", value = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=" }
# password = { from = "raw", value = "exact UTF-8 plaintext" }
# password = { value = "exact UTF-8 plaintext" }
# Inline raw, hex, and Base64 values remain recoverable from this file; their
# encoding is not encryption. Consumer requirements still apply:
# - `credentials.secret`: an exact textual UUID or at least 32 bytes;
# - `local_users.password` and `outbounds.auth.password`: 1..=255 UTF-8 bytes
#   with no ASCII control characters;
# - `management.token`: 16..=256 visible ASCII bytes;
# - `transport_secret` and `ed25519_public_key`: exactly 32 bytes;
# - `tls_pinned_certificate`: exactly one complete PEM certificate;
# - `tls_certificate_chain` and `tls_ca_certificate`: one or more complete PEM
#   certificates; hex/Base64 must decode to the complete PEM bytes, including
#   PEM boundaries and line endings;
# - `tls_private_key`: exactly one unencrypted PKCS#1, SEC1, or PKCS#8 PEM key.
# Global credentials use protocol credential and principal identities. Each
# MPP outbound uses `credential_id`; an MPP inbound accepts `credential_ids`.
[[credentials]]
credential_id = "home-client"
principal_id = "home"
secret = { from = "file", path = "mpp-credential.key" }
# expires_at_unix_secs = 1798761600
# revoked = false
# revocation_grace_seconds = 30
# Expiration or revocation rejects new authentication. Revocation grace delays
# retirement only for sessions already admitted by that credential; it never
# permits new authentication.

# Optional named users for local SOCKS5 and HTTP CONNECT authentication.
# Login names and passwords are protocol credentials; `principal_id` is the
# stable principal identity used by routing and admission. Usernames are
# 1..=255 UTF-8 bytes without a colon or ASCII controls. Inline values are
# stored in this document; Base64 is an encoding, not encryption.
# [[local_users]]
# name = "phone-login"
# principal_id = "family"
# username = "mobile-user"
# password = { from = "file", path = "local-proxy-password.key" }

[service]
# Supervision owns process generations, never MPP session state.
supervise = false
restart_backoff_ms = 1000
restart_max_backoff_ms = 30000
# Omit max_restarts for unlimited in-process restart attempts.
max_restarts = 10

[session]
# Established streams survive a complete carrier outage for five minutes.
# The same absolute ceiling bounds graceful TCP carrier retirement.
# Healthy idle streams with an authenticated carrier do not consume it.
retention_timeout_ms = 300000

[management]
# The API is disabled while listen is empty. To enable it, replace listen with
# one or more loopback addresses and reference a separate 16..=256 byte
# visible-ASCII operator-token file. Dashboard serving requires the API. The
# public HTTP surface is API v4 only, rooted at `/api/v4/`; older API paths are
# intentionally unsupported.
listen = []
# token = { from = "file", path = "management-token.key" }
dashboard = false
# Process-wide override for incoming peer diagnostics. `true` permits every
# authenticated MPP peer on every MPP endpoint, even when the endpoint-specific
# option or principal selector below denies it. It does not weaken MPP
# authentication and is independent of whether the local HTTP API is enabled.
allow_peer_diagnostics = false
# With a nonempty listener and token, this file is also the operator profile:
#   mptunnel --config ./config.toml status
#   mptunnel --config ./config.toml dns status
#   mptunnel --config ./config.toml dns explain example.com
# `route explain` and `doctor` also load this strict file without starting the
# runtime. See docs/OPERATIONS.md for their typed inputs and exit behavior.

[resources]
# These are bounded capacity envelopes. Live transport metrics choose paths and
# scheduling; these values do not select a fixed latency or bulk mode.
max_frame_bytes = 1048576
max_payload_bytes = 1048512
max_ack_ranges = 256
max_paths = 64
max_streams = 65536
max_quic_concurrent_bidi_streams = 65536
max_stream_window_bytes = 67108864
max_repair_bytes = 67108864
max_reorder_bytes = 67108864
max_reinjection_cache_chunks = 65536
max_reorder_buffer_chunks = 65536
max_retained_receive_ranges = 65536
max_datagram_queue_bytes = 16777216
max_path_flight_bytes = 67108864
max_reliable_relay_chunk_bytes = 524288

# TCP record heartbeats and native QUIC liveness are separate carrier
# mechanisms. The interval is the maximum idle delay; clients renew each idle
# probe within 80%-100% of it. Both remain below logical session retention.
tcp_path_heartbeat_interval_ms = 10000
tcp_path_heartbeat_timeout_ms = 30000
quic_path_keep_alive_interval_ms = 10000
quic_path_idle_timeout_ms = 30000

# New-flow admission is a separate limit applied while a flow opens. These
# limits do not derive from, resize, or feed MPP path/session/stream/queue budgets.
# Established permits do no per-byte or per-packet accounting.
[admission]
max_live_flows = 4096
max_concurrent_work = 512
max_live_flows_per_principal = 1024
max_live_flows_per_outbound = 3072
max_connects_per_outbound = 256
max_live_flows_per_target = 256
max_connects_per_target = 32
max_dns_work = 128

# DNS consists of named servers, policies, override records, and synthetic
# captures. Records and captures have no effect until attached to a selected
# policy. A route may explicitly select a policy with `dns_policy`.
# Otherwise, a DNS rule's exact domain wins over its longest matching suffix;
# `[dns].default` is used when no rule matches. Omitting `[dns]` creates a
# `system` server and a `default` policy. The active example names that policy
# `system` explicitly.
[dns]
default = "system"

# `protocol = "system"` delegates to the operating-system resolver and accepts
# no address, TLS name, HTTP path, or routed outbound. Every network protocol
# requires `address` as a usable unicast literal IP with a nonzero port, avoiding
# recursive DNS. Unspecified, multicast, and IPv4 broadcast addresses are
# rejected. Bracket an IPv6 address. The protocols are system, udp, tcp,
# udp-tcp, dot, doh, and doq.
[[dns.servers]]
name = "system"
protocol = "system"

# Plain DNS server forms. `udp-tcp` retries a truncated UDP response over TCP.
# [[dns.servers]]
# name = "plain-udp"
# protocol = "udp"
# address = "1.1.1.1:53"
#
# [[dns.servers]]
# name = "plain-tcp"
# protocol = "tcp"
# address = "1.1.1.1:53"
#
# [[dns.servers]]
# name = "plain-udp-tcp"
# protocol = "udp-tcp"
# address = "[2606:4700:4700::1111]:53"

# Encrypted DNS server forms. `tls_name` is required by DoT, DoH, and DoQ and
# is the authenticated TLS name; for DoH it is also the HTTPS authority. `path`
# is required only by DoH. It is 1..=256 visible-ASCII bytes, begins with one
# `/` (not `//`), and contains no `?`, `#`, or backslash. `outbound` is optional
# on every network protocol; omission uses the built-in direct connection. A
# selected outbound must have a literal-IP/DNS-independent
# endpoint and support every required transport: TCP, DoT, and DoH can use a
# direct, SOCKS5, HTTP CONNECT, HTTPS CONNECT, or MPP outbound; UDP, UDP-TCP,
# and DoQ require a native direct/source-bound outbound.
# [[dns.servers]]
# name = "secure-dot"
# protocol = "dot"
# address = "1.1.1.1:853"
# tls_name = "cloudflare-dns.com"
#
# [[dns.servers]]
# name = "secure-doh"
# protocol = "doh"
# address = "1.1.1.1:443"
# tls_name = "cloudflare-dns.com"
# path = "/dns-query"
# outbound = "edge-mpp"
#
# [[dns.servers]]
# name = "secure-doq"
# protocol = "doq"
# address = "[2606:4700:4700::1111]:853"
# tls_name = "cloudflare-dns.com"

# Every definition is parsed and validated. Runtime starts only policies named
# by `[dns].default`, `[[dns.rules]]`, or route `dns_policy`; the servers,
# records, captures, and routed outbounds used by those policies; and egress
# outbounds reached through routing, balancers, or a `tun-l3` inbound. Unused
# definitions create no DNS workers, caches, sockets, host bypasses, or
# synthetic-pool routes.

# Named exact immutable records have no effect until attached to a policy by
# name. An attached override applies to ordinary MPTUNNEL name resolution and
# managed DNS listeners. A/AAAA queries return the eligible family; other types
# and a missing eligible family return authoritative local NODATA without
# leaking the name upstream. An override contains 1..=64 unique addresses; once
# attached, its eligible addresses must fit `query.answers` and `answer_cidrs`.
# [[dns.override_records]]
# name = "router-home"
# domain = "router.home.arpa"
# addresses = ["192.168.1.1", "fd00::1"]

# Named synthetic capture also has no effect until a policy attaches it. An
# attached exact override wins before capture. Synthetic answers are produced
# only for A/AAAA queries received on managed `dns_listeners`; ordinary name
# resolution never synthesizes, and external `dns_redirects` only forward UDP
# port 53 to the listed resolver sockets. Each lease records its configuration
# generation, policy, and capture. A recovered flow keeps that policy when its
# route omits `dns_policy`; a route naming a different policy is rejected.
# Synthetic addresses are never reassigned to another domain while that
# configuration is active, and expired or unknown recovery fails closed.
# At least one pool is required. IPv4 pools must be in 198.18.0.0/15 and IPv6
# pools in fc00::/7. Managed split-VPN includes must cover every active pool and
# excludes cannot overlap one. Distinct active captures have disjoint pools;
# pools cannot contain an active DNS-server or attached override address.
# `capacity` is 1..=262144, `answer_ttl_seconds` is 1..=3600, and
# `recovery_ttl_seconds` is at least the answer TTL and at most 86400. Every
# configured pool must contain at least `capacity` usable addresses.
# [[dns.synthetic_capture]]
# name = "vpn-capture"
# ipv4_pool = "198.18.0.0/16"
# ipv6_pool = "fd00:4d50::/112"
# capacity = 4096
# answer_ttl_seconds = 30
# recovery_ttl_seconds = 120

# A policy lists 1..=16 unique DNS servers in order. `family` controls requested
# and returned A/AAAA families: ipv4-only, ipv6-only, ipv4-then-ipv6,
# ipv6-then-ipv4, ipv4-and-ipv6, or ipv6-and-ipv4. An `*-only` policy queries
# and returns only that family. A `*-then-*` policy queries the second family
# only when the preferred query returns no addresses and is not NXDOMAIN. An
# `*-and-*` policy queries both and returns the preferred family first.
# `security = "require-encrypted"` rejects any
# server other than DoT, DoH, or DoQ. Ordered strategy advances only after a
# transport/server failure; a DNS negative response is authoritative. Racing
# requires at least two servers and `fallback_ms`, which cannot exceed
# `query.timeout_ms`; zero starts all at once. A nonempty `answer_cidrs` accepts
# a response only when every A/AAAA address is inside at least one of at most
# 256 unique listed networks.
[[dns.policies]]
name = "system"
servers = ["system"]
family = "ipv4-and-ipv6"
security = "allow-plaintext"
strategy = "ordered"
answer_cidrs = []
override_records = []
# synthetic_capture = "vpn-capture"
query = { timeout_ms = 5000, inflight = 64, answers = 64 }
cache = { entries = 4096, positive_ttl_ms = 300000, negative_ttl_ms = 30000, stale_ms = 30000, prefetch_ms = 30000 }
# `query.timeout_ms` is the complete deadline for each A or AAAA lookup across
# that policy's servers. Its range is 1..=60000 ms; `query.inflight` is
# 1..=1024 and `query.answers` is 1..=64. `cache.entries` is 0..=65536.
# Positive and negative TTL caps are 1..=86400000 ms; stale and prefetch caps
# are 0..=86400000 ms. `stale_ms = 0` disables stale-on-error and
# `prefetch_ms = 0` disables refresh-ahead.
#
# [[dns.policies]]
# name = "secure"
# servers = ["secure-doh", "secure-dot"]
# family = "ipv4-and-ipv6"
# security = "require-encrypted"
# strategy = "race"
# fallback_ms = 50
# answer_cidrs = ["0.0.0.0/0", "::/0"]
# override_records = ["router-home"]
# synthetic_capture = "vpn-capture"
# query = { timeout_ms = 5000, inflight = 64, answers = 64 }
# cache = { entries = 4096, positive_ttl_ms = 300000, negative_ttl_ms = 30000, stale_ms = 30000, prefetch_ms = 30000 }
#
# DNS selection rules name policies, not records or captures. Exact selection
# wins over the longest suffix, then `[dns].default`; each named attachment is
# therefore scoped to whichever selected policies reference it.
# [[dns.rules]]
# name = "private-host"
# exact = "router.corp.example"
# policy = "secure"
# explanation = "private host uses the secure DNS policy"
#
# [[dns.rules]]
# name = "private-zone"
# suffix = "corp.example" # Exactly one of exact or suffix.
# policy = "secure"

# One listener may accept both proxy protocols by using `protocol = "mixed"`;
# it shares the same `local_users` and admission policy and defaults to IPv4
# loopback port 1080. HTTP is CONNECT-only. The separate listeners below
# document each dedicated protocol form.
# [[inbounds]]
# name = "local-mixed"
# protocol = "mixed"
# listen = ["127.0.0.1:1080"]
# local_users = ["phone-login"]
#
[[inbounds]]
name = "local-socks"
protocol = "socks5"
# Repeat addresses for explicit IPv4/IPv6 listeners, for example
# listen = ["127.0.0.1:1080", "[::1]:1080"]. An empty list defaults to IPv4
# loopback port 1080.
listen = ["127.0.0.1:1080"]
# New flows are assigned by the ordered rules in `[routing]` below.
# local_users = ["phone-login"]

[inbounds.admission]
# Connection-open limits; these do not derive from MPP resource limits.
max_connections = 1024
max_connections_per_source = 256
max_connections_per_principal = 512
handshake_timeout_ms = 10000

[[inbounds]]
name = "local-http"
protocol = "http-connect"
# An empty list defaults to IPv4 loopback port 8080.
listen = ["127.0.0.1:8080"]
# local_users = ["phone-login"]

# Optional fixed-target local port forwards. Unlike proxy listeners, `listen`
# and `target` are required and port zero is rejected. Each accepted flow uses
# the normal routing, DNS, outbound, and balancer pipeline.
#
# [[inbounds]]
# name = "local-tcp-forward"
# protocol = "tcp-forward"
# listen = ["127.0.0.1:8443"]
# target = "service.example:443"
# max_connections = 1024
#
# [[inbounds]]
# name = "local-udp-forward"
# protocol = "udp-forward"
# listen = ["127.0.0.1:5353"]
# target = "resolver.example:53"
# max_associations = 1024
# idle_timeout_ms = 60000
# datagram_ttl_ms = 30000
#
# One `mixed-forward` inbound binds TCP and UDP on every listed address/port
# and forwards both transports to the same fixed target. TCP connection and
# UDP association limits remain independent.
# [[inbounds]]
# name = "local-mixed-forward"
# protocol = "mixed-forward"
# listen = ["127.0.0.1:853"]
# target = "resolver.example:853"
# max_connections = 1024
# max_associations = 1024
# idle_timeout_ms = 60000
# datagram_ttl_ms = 30000

# Experimental TUN-L4 ingress. It uses the same routing policy as local proxy
# inbounds. Omitting `host` is explicit external/manual mode: MPTUNNEL opens
# the device, while the operator owns host routes and DNS.
# [[inbounds]]
# name = "local-tun"
# protocol = "tun"
# interface_name = "mptun0"
# ipv4 = "10.88.0.1"
# disable_ipv4 = false
# ipv4_prefix = 24
# ipv4_gateway = "10.88.0.254"
# ipv6 = "fd00:88::1"
# ipv6_prefix = 64
# mtu = 1500
# disable_icmp = false
# External/manual mode rewrites captured UDP port-53 destinations to a listed
# `dns_redirects` socket, preferring an address of the original IP family.
# dns_redirects = ["1.1.1.1:53", "[2606:4700:4700::1111]:53"]
# `dns_ttl_ms` bounds external DNS datagram associations and caps TTLs returned
# by the managed local DNS listener.
# dns_ttl_ms = 5000
#
# To run IPv6-only, set disable_ipv4 = true and remove ipv4 and ipv4_gateway.
# At least one IP family is required; IPv6 requires an MTU of at least 1280.
#
# The supported explicit spelling for external/manual mode is:
# [inbounds.host]
# mode = "external"
#
# On a supported host MPTUNNEL can instead own the interface, routes, endpoint
# bypass, DNS publication, and cleanup transactionally. At most one managed TUN
# inbound is allowed. Managed mode requires every active DNS policy to be
# encrypted and non-system. Full mode additionally requires at least one local
# DNS listener address.
# `dns_redirects` and `ipv4_gateway` are external/manual fields and must remain
# unset in this mode. Android `VpnService` lifecycle stays host-provided and
# therefore uses external mode.
#
# [inbounds.host]
# mode = "managed"
# route_mode = "full" # Or "split" with nonempty include_cidrs.
# include_cidrs = []
# exclude_cidrs = []
# `true` bypasses directly connected LAN prefixes outside the tunnel.
# local_lan = true
# Managed mode publishes these local addresses as system-facing DNS listeners;
# queries captured there are answered through the selected `[dns]` policy.
# Listener IPs must be usable, belong to a configured TUN address family, and
# must not be covered by `exclude_cidrs`. In managed mode `dns_ttl_ms` also caps
# TTLs returned by these listeners.
# dns_listeners = ["10.88.0.53", "fd00:88::53"]
#
# Optional Linux-only RPDB tuning is nested below the portable VPN policy.
# Omit this table for validated platform defaults.
# [inbounds.host.linux]
# route_table = 51820
# native_rule_priority = 9999
# capture_rule_priority = 10000
# socket_mark = 0x4d505455

# Experimental L3 client (alternative profile)
#
# A document containing only `tun-l3`/`mpp-l3` inbounds is an L3 profile; no
# separate mode switch is needed. L3 and L4 inbound protocols cannot be mixed.
# Unlike `protocol = "tun"`, `tun-l3` does not enter L4 routing or terminate
# inner TCP/UDP flows. The server assigns the interface address after MPP
# authentication; this process opens only the packet device. Host routes, DNS,
# firewall policy, forwarding, and NAT remain external. The selected outbound
# must be MPP and may use both TCP and QUIC. A given MPP outbound may be selected
# by only one `tun-l3` inbound. L3 profiles omit `[routing]`, omit that outbound's
# `[outbounds.performance]`, and either omit `[admission]` or keep only
# `max_dns_work`; every other admission limit belongs to L4 flows.
# [[inbounds]]
# name = "site-tunnel"
# protocol = "tun-l3"
# outbound = "edge-mpp"
# interface_name = "mptun-l3"

[[outbounds]]
name = "edge-mpp"
protocol = "mpp"
# Permit this client to answer a sanitized diagnostics request from its peer.
# The default is false; the management-global override permits every endpoint.
# allow_peer_diagnostics = false
# TCP and QUIC/UDP remain independent carriers under one MPP session.
paths = [
  { name = "path-1", endpoint = "tcp://server.example.com:7443" },
  { name = "path-2", endpoint = "quic://server.example.com:7443" },
]
# Grammar: `tcp://HOST:PORT[-END]` or `quic://HOST:PORT[-END]`, followed by an
# optional `?KEY=VALUE&...` query. IPv6 literals require brackets, for example
# `quic://[2001:db8::10]:7443`. Ports are canonical decimal 1..=65535 without
# leading zeroes. A range is an inclusive, ascending pair with distinct ends.
# Each query key may occur once; values are mandatory; unknown keys fail load.
#
# Outbound paths may use a port range. One concrete port remains fixed across
# all DNS/address-family attempts for one physical carrier establishment.
# Ranged QUIC rotates the authenticated connection's socket; ranged TCP replaces
# one carrier only at an active-work quiescent boundary. MPP inbound paths use
# one fixed listen port; publish a range only through external redirection to
# that listener. Other proxy, DNS, target, and management addresses are not
# carrier URIs and always use one port.
#
# Startup hints are replaced by live evidence:
# - source-address=<IP>: bind this TCP/QUIC client carrier to one literal source
#   address; omission lets the operating system select it;
# - initial-srtt-ms=<1..4294967295>: initial smoothed RTT in milliseconds;
#   omission uses the 333 ms runtime startup model until live evidence exists;
# - initial-rttvar-ms=<0..4294967295>: initial RTT variation in milliseconds;
#   omission uses 0 ms until live evidence exists;
# - exactly one initial-rate-bps|initial-rate-kbps|initial-rate-mbps=<nonzero-u64>,
#   or initial-rate=unknown|unlimited; scaled values must fit in u64 bits/second;
#   omission means unknown.
#
# Transport and carrier-group controls:
# - max-datagram-payload-bytes=512..65000: QUIC client only; omission uses the
#   smaller of `[resources].max_payload_bytes` and 65000;
# - max-tcp-carriers=1..65535: TCP client only; omission defaults to 3;
# - port-rotation-interval-ms=5000..4294967295: ranged TCP/QUIC client paths
#   only; omission on a ranged path defaults to 300000 ms.
#
# Scheduling constraints are explicit `true` or `false`:
# - backup: use only after schedulable regular paths (default false);
# - expensive: add an evidence-scaled scheduling cost (default false);
# - allow-bulk: permit throughput scheduling (default true);
# - control-only: prohibit application data and retain control/probe work only
#   (default false);
# - allow-datagrams: permit application datagrams (default true); the key is
#   accepted on TCP only because QUIC always permits datagrams.
# MPP listener paths use one fixed port. They may use the `initial-*` and
# scheduling boolean options; TCP listeners may also use `allow-datagrams`.
# `source-address`, `max-datagram-payload-bytes`, `max-tcp-carriers`, port
# rotation, and port ranges are client-only and are rejected on listeners.
#
# Complete examples:
# tcp://192.0.2.10:7443?source-address=192.0.2.20&initial-srtt-ms=40&initial-rttvar-ms=5&initial-rate-mbps=100&max-tcp-carriers=3&backup=false&expensive=false&allow-bulk=true&control-only=false&allow-datagrams=true
# quic://server.example.com:7000-7999?initial-rate=unknown&max-datagram-payload-bytes=1200&port-rotation-interval-ms=300000&backup=false&expensive=false&allow-bulk=true&control-only=false
path_probe_interval_ms = 10000
path_probe_timeout_ms = 2000

# Optional L4 MPP repair traffic is evidence-gated and capped by this operator
# budget. Omit this table when the outbound is selected by `tun-l3`.
# [outbounds.performance]
# extra_traffic_hint_percent = 5

[outbounds.security]
credential_id = "home-client"
# The pinned QUIC and TLS-fallback TCP certificate identity is independent from
# the MPP credential. Its default is mptunnel.example; the carrier endpoint may
# be a different DNS name or a literal IP address.
# tls_server_name = "mptunnel.example"
tls_pinned_certificate = { from = "file", path = "REPLACE_WITH_SERVER_CERT.pem" }
# Endpoint-wide transport protection uses the same raw 32-byte file on both
# peers. This key is separate from every MPP client credential. Omit the field
# only when both peers use TLS 1.3 TCP and public QUIC Initials instead.
transport_secret = { from = "file", path = "mpp-transport.key" }
# Direct-paste alternative (`openssl rand -hex 32`); Base64/raw use the same schema:
# transport_secret = { from = "hex", value = "REPLACE_WITH_64_HEX_DIGITS" }
auth_freshness_window_seconds = 300

[routing]

# Hostname representation is one node-wide routing choice, shared by local
# and MPP inbounds:
#   as-is       - routing never performs DNS; domain-capable outbounds receive
#                 the original hostname and IP-dependent rules cannot match it
#   route-only  - resolve only for an IP-dependent routing decision, then keep
#                 the original hostname for a domain-capable outbound
#   full-resolve - resolve every hostname and pass authorized literal IPs
# Omission retains the historical demand-driven compatibility behavior.
# Resolution mode never changes literal-IP authorization. Private literals
# require a narrow allow-restricted rule independently on each node that
# handles them; as-is hostnames bypass CIDR matching only because no local DNS
# answer exists to match.
# target_resolution = "route-only"

# Routing is one ordered, first-match table shared by every L4 local and MPP
# inbound. A normal rule selects exactly one `outbound` or `balancer`; its
# ordinary allow decision is inferred. Use `decision = "allow-restricted"`
# only to authorize a narrowly matched private or special-use destination.
# Terminal `reject` and response-free `drop` rules select no egress. If no rule
# matches, traffic is rejected. A final catch-all is useful for clarity but is
# not required; MPTUNNEL never selects the first outbound implicitly.
#
# Match fields are strict: domain exact/suffix/keyword/regex or signed sets,
# destination/source CIDRs, destination/source ports, TCP/UDP, named inbound,
# principal ID, and pre/post-resolution stage. Nonempty categories are ANDed;
# values inside one category are ORed. Unknown fields fail configuration load.
# Omitted `inbounds` or `principal_ids` means any; scalar `"*"` is an
# equivalent explicit spelling. A concrete name must exist and be reachable.
# An unauthenticated local proxy, fixed-forward, or TUN-L4 flow has principal
# `anonymous`. An authenticated proxy uses its selected `local_users`
# principal, and an MPP inbound uses the authenticated credential principal.
# `stages` is an expert control; ordinary CIDR rules naturally wait for address
# evidence without spelling a stage.
#
# Optional signed domain/GeoIP rule sets are loaded and verified atomically.
# Publisher keys use the same byte-material source and
# must resolve to exactly 32 bytes.
# Every set pins its signed ID, publisher, and minimum accepted revision so an
# otherwise valid older artifact cannot be substituted during reload.
# `file` is a normal file path, not a material-source table; a relative path
# resolves beside this TOML. `minimum_revision` must be nonzero.
#
# [[routing.rule_set_publishers]]
# publisher_id = "official"
# ed25519_public_key = { from = "base64", value = "REPLACE_WITH_32_BYTE_ED25519_PUBLIC_KEY_BASE64" }
#
# [[routing.rule_sets]]
# rule_set_id = "geo-public"
# publisher_id = "official"
# minimum_revision = 42
# file = "rules/geo-public.ruleset.json"
#
# Rule-set domains are ORed with a rule's explicit domain fields; rule-set
# networks are ORed with `destination_cidrs`. The two categories remain ANDed
# with every other nonempty match category.
# [[routing.rules]]
# name = "signed-policy"
# domain_exact = ["service.example"]
# domain_suffix = ["example"]
# domain_keyword = ["service"]
# domain_regex = ["^service[0-9]+\\.example$"]
# domain_rule_set_ids = ["geo-public"]
# destination_cidrs = ["203.0.113.0/24"]
# destination_rule_set_ids = ["geo-public"]
# source_cidrs = ["10.0.0.0/8"]
# destination_ports = [443, "8000-8999"]
# source_ports = [1024, "49152-65535"]
# networks = ["tcp", "udp"]
# inbounds = ["local-socks"]
# principal_ids = ["family"]
# stages = ["post-resolution"]
# decision = "allow" # Optional and redundant for an ordinary egress rule.
# outbound = "edge-mpp"
# balancer = "edge-balancer" # Alternative; never set both.
# initial_demand = "throughput" # automatic (default) or throughput
# explanation = "route signed domain and network policy through the edge"

# A route-selected DNS policy must be known before resolution, so it belongs on
# a domain/source/inbound/principal rule rather than one selected by a
# destination CIDR or CIDR-bearing signed set. Such a rule must omit `stages` or
# include `pre-resolution`; `stages = ["post-resolution"]` is invalid.
# [[routing.rules]]
# name = "secure-domain-resolution"
# domain_suffix = ["corp.example"]
# dns_policy = "secure"
# outbound = "edge-mpp"

# Terminal rules have no outbound, balancer, DNS policy, or demand hint.
# [[routing.rules]]
# name = "reject-example"
# domain_suffix = ["blocked.example"]
# decision = "reject" # Use "drop" when no application refusal should be sent.

[[routing.rules]]
name = "default"
inbounds = ["local-socks", "local-http"]
outbound = "edge-mpp"
explanation = "route local proxy traffic through the primary MPP outbound"

# When MPTUNNEL has or resolves a literal address, ordinary allow does not
# authorize loopback, private, link-local, metadata, multicast, or unspecified
# destinations. A domain delegated unchanged to a domain-capable outbound is
# resolved at that next hop. Select `dns_policy` on the route or use an
# IP-dependent/post-resolution rule when this node must enforce the resulting
# address. Authorize an internal destination only with a narrow rule placed
# before a broader one.
# [[routing.rules]]
# name = "allow-home-service"
# inbounds = ["mpp-listener"]
# principal_ids = ["home"]
# destination_cidrs = ["192.168.1.0/24", "fd00::/8"]
# destination_ports = [443]
# networks = ["tcp"]
# decision = "allow-restricted"
# outbound = "direct-egress"

# A second independent MPP outbound can join the edge-balancer routing example
# below; it keeps its own session, carrier set, and performance policy.
# [[credentials]]
# credential_id = "secondary-client"
# principal_id = "secondary"
# secret = { from = "file", path = "secondary-mpp-credential.key" }
#
# [[outbounds]]
# name = "edge-mpp-secondary"
# protocol = "mpp"
# paths = [
#   { name = "path-1", endpoint = "tcp://secondary.example.com:7443?backup=true&expensive=true" },
#   { name = "path-2", endpoint = "quic://secondary.example.com:7443?backup=true&expensive=true" },
# ]
# path_probe_interval_ms = 10000
# path_probe_timeout_ms = 2000
#
# [outbounds.performance]
# extra_traffic_hint_percent = 5
#
# [outbounds.security]
# credential_id = "secondary-client"
# tls_server_name = "secondary.example.com"
# tls_pinned_certificate = { from = "file", path = "secondary-server-cert.pem" }
# transport_secret = { from = "file", path = "secondary-mpp-transport.key" }
# auth_freshness_window_seconds = 300

# Optional server-side MPP inbound
#
# Uncomment this block, the `mpp-direct-egress` route, and one non-MPP outbound
# below to run a symmetric L4 node. The active edge route is deliberately
# scoped to local inbounds; routes reached from an MPP inbound cannot chain
# into another MPP outbound.
# [[inbounds]]
# name = "mpp-listener"
# protocol = "mpp"
# paths = [
#   { name = "path-1", endpoint = "tcp://0.0.0.0:7443" },
#   { name = "path-2", endpoint = "quic://0.0.0.0:7443" },
# ]
# Omission denies peer diagnostics. Use concrete accepted principal IDs or the
# scalar `"*"` for every authenticated principal. The management-global option
# above permits all regardless of this endpoint selector.
# peer_diagnostics_principal_ids = ["home"]
#
# [inbounds.performance]
# extra_traffic_hint_percent = 5
#
# [inbounds.security]
# credential_ids = ["home-client"]
# tls_certificate_chain = { from = "file", path = "server-cert.pem" }
# tls_private_key = { from = "file", path = "server-key.pem" }
# transport_secret = { from = "file", path = "mpp-transport.key" }
# auth_freshness_window_seconds = 300
# authentication_timeout_ms = 5000
# Independently caps authentication work and silent Noise-rejection retention.
# max_pending_authentications = 1024
#
# [[routing.rules]]
# name = "mpp-direct-egress"
# inbounds = ["mpp-listener"]
# outbound = "direct-egress"
#
# Experimental server-owned L3 address plan (alternative profile). Use an
# `mpp-l3` inbound, keep only L3 inbounds, and omit `[routing]`.
# L4 TCP/UDP forwarding is then unavailable. Each configured family requires a
# pool and a usable server address. At least one pool and one allocation are
# required. Every allocation names an active accepted principal and supplies at
# least one usable, unique address in its pool. Addresses and `allowed_ips`
# cannot overlap ownership across principals or contain a server address. MTU
# defaults to 1500, with minimum 576 and 1280 when IPv6 is configured. Pools
# validate explicit stable principal allocations; they are never learned from
# source IP addresses. One
# live logical tunnel per principal is retained, and a new authenticated session
# supersedes its previous attachment set. Additional `allowed_ips` are routed to
# that principal only when the host has independently installed the corresponding
# route/forwarding policy.
# [[inbounds]]
# name = "mpp-l3-listener"
# protocol = "mpp-l3"
# paths = [
#   { name = "path-1", endpoint = "tcp://0.0.0.0:7443" },
#   { name = "path-2", endpoint = "quic://0.0.0.0:7443" },
# ]
# peer_diagnostics_principal_ids = ["home"]
#
# [inbounds.security]
# credential_ids = ["home-client"]
# tls_certificate_chain = { from = "file", path = "server-cert.pem" }
# tls_private_key = { from = "file", path = "server-key.pem" }
# transport_secret = { from = "file", path = "mpp-transport.key" }
#
# [inbounds.tun_l3]
# interface_name = "mptun-l3-server"
# ipv4_pool = "10.89.0.0/24"
# ipv4 = "10.89.0.1"
# ipv6_pool = "fd89::/64"
# ipv6 = "fd89::1"
# mtu = 1500
#
# [[inbounds.tun_l3.allocations]]
# principal_id = "home"
# ipv4 = "10.89.0.2"
# ipv6 = "fd89::2"
# allowed_ips = ["192.168.50.0/24"]
#
# Server egress outbounds
#
# Direct egress resolves domain targets through the DNS policy selected by
# routing or DNS domain rules. That policy may use a system, direct, or routed
# remote DNS server. Omit all bind fields to let the OS select source addresses
# for both families. Legacy bind_ip selects
# one source address and makes this outbound eligible only for that address
# family; it cannot be combined with bind_ipv4 or bind_ipv6. Prefer bind_ipv4,
# bind_ipv6, or both for explicit family-specific sources. Once either new
# field is present, only configured families are eligible; rules and balancers
# skip an ineligible family before dialing. Source addresses are bound per connection:
# a temporarily absent address fails that attempt without terminating the node,
# and later attempts can succeed after the address or interface returns.
# [[outbounds]]
# name = "direct-egress"
# protocol = "direct"
# Legacy single-family form:
# bind_ip = "192.0.2.10"
# Preferred explicit-family form (one or both):
# bind_ipv4 = "192.0.2.10"
# bind_ipv6 = "2001:db8::10"
# connect_timeout_ms = 10000
#
# Proxy `endpoint` is required `HOST:PORT`; bracket IPv6. If `[outbounds.auth]`
# is present, both username and password are required. Usernames are 1..=255
# UTF-8 bytes with no colon or ASCII control characters.
#
# Relay through SOCKS5. TCP CONNECT and UDP ASSOCIATE are supported when the
# proxy implements them. A canonical domain is normally carried to the proxy
# for next-hop resolution. Routing that needs IP evidence first resolves
# through the selected DNS policy and carries the
# authorized literal instead.
# [[outbounds]]
# name = "socks5-egress"
# protocol = "socks5"
# endpoint = "127.0.0.1:1080"
# connect_timeout_ms = 10000
#
# [outbounds.auth]
# username = "proxy-user"
# password = { from = "file", path = "proxy-password.key" }
#
# Plain HTTP CONNECT carries TCP targets and supports the same referenced
# authentication table. It preserves a canonical domain unless routing
# requires authorized IP evidence.
# [[outbounds]]
# name = "http-egress"
# protocol = "http-connect"
# endpoint = "127.0.0.1:8080"
# connect_timeout_ms = 10000
#
# HTTPS CONNECT authenticates the proxy with WebPKI. `tls_server_name` defaults
# to the endpoint host. Optional `tls_ca_certificate` material adds private
# roots; it does not disable hostname verification.
# [[outbounds]]
# name = "https-egress"
# protocol = "https-connect"
# endpoint = "127.0.0.1:8443"
# tls_server_name = "proxy.example.com"
# tls_ca_certificate = { from = "file", path = "private-proxy-ca.pem" }
# connect_timeout_ms = 10000
#
# [outbounds.auth]
# username = "proxy-user"
# password = { from = "file", path = "proxy-password.key" }

# Routing policies
#
# Any local L4 inbound may select a balancer. A rule reachable from an MPP
# inbound may select only a non-MPP outbound or a balancer with no MPP member.
# Balancers contain outbounds only and cannot be nested.
# [routing]
#
# A balancer chooses one member outbound once per new flow. MPP member sessions
# and carriers remain independent and are never merged. Selection uses only
# end-to-end probe/open/flow outcomes; it cannot inspect per-carrier MPP
# scheduler state or carrier metrics.
# [[routing.balancers]]
# name = "edge-balancer"
# strategy = "least-latency"
# manual_outbound = "edge-mpp"
# Old latency remains observable but stops ranking after this age.
# freshness_ttl_ms = 30000
# members = [
#   { outbound = "edge-mpp", weight = 3, mode = "enabled" },
#   { outbound = "edge-mpp-secondary", weight = 1, mode = "enabled" },
# ]
# health = { failure_threshold = 3, recovery_threshold = 2, initial_backoff_ms = 1000,
#            maximum_backoff_ms = 60000 }
# stickiness = { key = "destination", ttl_ms = 60000, capacity = 4096 }
# probe = { target = "192.0.2.1:443", interval_ms = 10000, timeout_ms = 2000 }
#
# `ordered-failover` tries enabled members in configured order. Retry occurs
# only before flow commit. Each attempted TCP/native UDP member retains its own
# outbound stage timeout. The first selected IP-only member may trigger one
# flow-level lookup bounded by the selected DNS policy; failure skips later
# IP-only members without re-querying, so one blackhole cannot consume a
# successor's budget.
# [[routing.balancers]]
# name = "egress-fallback"
# strategy = "ordered-failover"
# members = [{ outbound = "direct-egress" }, { outbound = "socks5-egress" }]
#
# Strategies are `manual`, `ordered-failover`, `round-robin`, `random`,
# `weighted-random`, `least-latency`, and `least-load`. `manual` requires
# `manual_outbound`. `manual_outbound` on an automatic strategy is an initial
# operator pin that can be cleared through the management action API.
#
# Stickiness keys are `destination` and `principal`. Member modes are
# `enabled`, `draining`, and `disabled`; draining and disabled members receive
# no new flows. An active probe target must be a literal IP authority and every
# member of that balancer must support TCP. Probes are globally bounded and
# separately accounted from user flows. After a target connection or datagram
# association commits, MPTUNNEL reports its outcome but never transparently
# replays the flow through another balancer member.
