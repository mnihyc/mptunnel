[package]
name = "mptunnel"
version = "0.2.6"
authors = ["mnihyc"]
edition = "2024"
description = "Encrypted multipath proxy and tunnel"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mnihyc/mptunnel"
publish = false
rust-version = "1.96"
keywords = ["multipath", "proxy", "quic", "tunnel"]
categories = ["network-programming"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
lab-diagnostics = []

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive", "env"] }
futures = "0.3.33"
getrandom = "0.4.3"
h2 = "0.4.15"
h3 = { version = "=0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "=0.0.10"
hmac = "0.13.0"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
httparse = "1.10.1"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "tls-ring", "quic-ring", "webpki-roots"] }
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
http = "1.5.0"
idna = "1.1"
ipnet = "2.12.1"
netstack-smoltcp = "0.2.4"
percent-encoding = "2.3.2"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "=0.11.16", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["perf", "std", "unicode-case"] }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "tls12"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = "1.15.2"
snow = { version = "=0.10.0", default-features = false, features = ["ring-accelerated", "use-chacha20poly1305", "use-curve25519", "use-sha2"] }
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml = "1.1.4"
time = "0.3.55"
tun-rs = { version = "2.8.8", features = ["async", "async_framed"] }
uuid = { version = "1.24.0", default-features = false }
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
route_manager = "0.2.13"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
route_manager = "0.2.13"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[dev-dependencies]
jni = "0.22.4"
rcgen = "0.14.8"

[patch.crates-io]
quinn-proto = { path = "crates/quinn-proto" }
