name: ci

on:
  push:
  pull_request:

jobs:
  host-checks:
    name: host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Maintainability line-count warning
        if: runner.os == 'Linux'
        run: scripts/check-line-counts.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build product binary
        run: cargo build --bin mptunnel

  target-checks:
    name: target check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: aarch64-linux-android
            android: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure Android NDK
        if: matrix.android
        shell: bash
        run: |
          : "${ANDROID_NDK_ROOT:?GitHub runner did not provide an Android NDK}"
          toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$toolchain/aarch64-linux-android21-clang"
          test -x "$cc"
          test -x "$toolchain/llvm-ar"
          {
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"
      - name: Check product target
        if: ${{ !matrix.android }}
        run: cargo check --target ${{ matrix.target }} --bin mptunnel
      - name: Check Android library source
        if: matrix.android
        run: cargo check --target ${{ matrix.target }} --lib
