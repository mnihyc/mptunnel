name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: Source quality
    uses: ./.github/workflows/release-quality-gate.yml

  version:
    name: Version and published releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate immutable release version
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > known-tags.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
            --jq '.[].ref | sub("^refs/tags/"; "")' > repository-tags.txt
          grep --fixed-strings --line-regexp --invert-match "$CANDIDATE_TAG" repository-tags.txt \
            >> known-tags.txt || true
          sort -u -o known-tags.txt known-tags.txt
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python3 .github/scripts/check-release-version-gate.py \
            --candidate-tag "$CANDIDATE_TAG" \
            --package-version "$package_version" \
            --known-tags-file known-tags.txt

  package:
    name: Package ${{ matrix.target }}
    needs: [quality, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            kind: musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            kind: unix
          - os: ubuntu-24.04
            target: aarch64-linux-android
            kind: android
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install musl C compiler
        if: matrix.kind == 'musl'
        shell: bash
        env:
          CC_ENV: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'x86_64_unknown_linux_musl' || 'aarch64_unknown_linux_musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${CC_ENV}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        if: matrix.kind == 'android'
        shell: bash
        run: |
          ndk_version="27.3.13750724"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;${ndk_version}"
          toolchain="${ANDROID_HOME}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="${toolchain}/aarch64-linux-android21-clang"
          test -x "$cc"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=${toolchain}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Package Unix artifact
        if: matrix.kind != 'windows'
        shell: bash
        run: scripts/package-release.sh --target "${{ matrix.target }}"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: scripts/package-release.ps1 -Target "${{ matrix.target }}"

      - name: Run native platform tests
        if: matrix.kind == 'windows' || matrix.kind == 'unix'
        env:
          RUSTFLAGS: ${{ matrix.kind == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      - name: Verify Unix package manifest and binary
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          archive="dist/mptunnel-${version}-${target}.tar.gz"
          python3 .github/scripts/verify-release-archive.py \
            --archive "$archive" --target "$target" --version "$version"
          binary="target/${target}/release/mptunnel"
          file "$binary"
          case "$target" in
            x86_64-*) file "$binary" | grep -Eiq 'x86[-_ ]64|x86-64' ;;
            aarch64-*) file "$binary" | grep -Eiq 'aarch64|arm64' ;;
            *) echo "unsupported release architecture: $target" >&2; exit 1 ;;
          esac
          if [[ "$target" == *apple-darwin ]]; then
            otool -L "$binary"
          else
            readelf -h "$binary"
          fi

      - name: Verify Windows package manifest, architecture, and imports
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $target = "${{ matrix.target }}"
          $archive = "dist/mptunnel-$version-$target.zip"
          python .github/scripts/verify-release-archive.py `
            --archive $archive --target $target --version $version
          if ($LASTEXITCODE -ne 0) { throw "Release archive verification failed" }

          $binary = "target/$target/release/mptunnel.exe"
          $inspection = & dumpbin.exe /HEADERS /DEPENDENTS $binary
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
          $inspection | Write-Output
          $expectedMachine = if ($target.StartsWith("x86_64-")) { "machine \(x64\)" } else { "machine \(ARM64\)" }
          if (($inspection -join "`n") -notmatch $expectedMachine) {
            throw "PE machine type does not match $target"
          }
          if (($inspection -join "`n") -match '(?i)(VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt-)[^\s]*\.dll') {
            throw "Windows release unexpectedly depends on the dynamic MSVC/UCRT runtime"
          }

      - name: Verify Unix binary version
        if: matrix.kind != 'android' && matrix.kind != 'windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/mptunnel"
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$("$binary" --version)" = "mptunnel ${version}"

      - name: Verify Windows binary version
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $binary = "target/${{ matrix.target }}/release/mptunnel.exe"
          $actual = & $binary --version
          $expected = "mptunnel $($metadata.packages[0].version)"
          if ($actual -ne $expected) {
              throw "Expected '$expected', got '$actual'"
          }

      - name: Require static musl linkage
        if: matrix.kind == 'musl'
        shell: bash
        run: file target/${{ matrix.target }}/release/mptunnel | grep -E 'statically linked|static-pie linked'

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mptunnel-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish and verify
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release manifest and verify inventory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          rust_version="$(rustc --version | awk '{print $2}')"
          jq -n \
            --arg version "$version" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg rust "$rust_version" \
            '{schema_version: 1, product: "mptunnel", version: $version, tag: $tag, commit: $commit, rust: $rust}' \
            > artifacts/version.json

          while IFS= read -r checksum; do
            (cd artifacts && sha256sum --check "$(basename "$checksum")")
          done < <(find artifacts -maxdepth 1 -type f -name '*.sha256' | sort)

          targets=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
            x86_64-apple-darwin
            aarch64-apple-darwin
            aarch64-linux-android
          )
          : > expected-assets.txt
          for target in "${targets[@]}"; do
            extension="tar.gz"
            if [[ "$target" == *windows* ]]; then extension="zip"; fi
            archive="mptunnel-${version}-${target}.${extension}"
            printf '%s\n%s\n' "$archive" "${archive}.sha256" >> expected-assets.txt
          done
          printf '%s\n' version.json >> expected-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS)
          mv SHA256SUMS artifacts/SHA256SUMS
          printf '%s\n' SHA256SUMS >> expected-assets.txt
          sort -o expected-assets.txt expected-assets.txt

      - name: Attest release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Create draft release payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" artifacts/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "mptunnel ${version}"

      - name: Verify draft assets from a fresh download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-download
          gh release download "$RELEASE_TAG" --dir release-download
          (cd release-download && sha256sum --check SHA256SUMS)
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

      - name: Remove failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == true ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
