[package]
name = "mptunnel"
version = "0.1.0"
edition = "2024"
description = "Multipath proxy and tunnel prototype"
license = "Apache-2.0"

[dependencies]
bytes = "1.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
hmac = "0.12"
httparse = "1.10"
percent-encoding = "2.3"
quinn-proto = { version = "0.11", default-features = false }
sha2 = "0.10"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
