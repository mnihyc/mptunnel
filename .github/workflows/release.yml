name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONPYCACHEPREFIX: .tmp/python-cache

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: Source quality
    uses: ./.github/workflows/release-quality-gate.yml

  version:
    name: Version and published releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable release version
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/ci/version
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            > .tmp/ci/version/published-tags.txt
          if grep --fixed-strings --line-regexp --quiet "$CANDIDATE_TAG" \
            .tmp/ci/version/published-tags.txt; then
            # A rerun for an immutable published release is a verification
            # path, even if newer releases now exist. The exact Cargo/tag
            # match remains mandatory; publication preflight proves the
            # release identity and inventory without mutating it.
            : > .tmp/ci/version/known-tags.txt
          else
            grep --fixed-strings --line-regexp --invert-match "$CANDIDATE_TAG" \
              .tmp/ci/version/published-tags.txt \
              > .tmp/ci/version/known-tags.txt || true
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
              --jq '.[].ref | sub("^refs/tags/"; "")' > .tmp/ci/version/repository-tags.txt
            grep --fixed-strings --line-regexp --invert-match "$CANDIDATE_TAG" \
              .tmp/ci/version/repository-tags.txt \
              >> .tmp/ci/version/known-tags.txt || true
          fi
          sort -u -o .tmp/ci/version/known-tags.txt .tmp/ci/version/known-tags.txt
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python3 packaging/tools/check_release_version_gate.py \
            --candidate-tag "$CANDIDATE_TAG" \
            --package-version "$package_version" \
            --known-tags-file .tmp/ci/version/known-tags.txt

  package:
    name: Package ${{ matrix.target }}
    needs: [quality, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            kind: musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            kind: unix
          - os: ubuntu-24.04
            target: aarch64-linux-android
            kind: android
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install Rust binary inspection tools
        if: matrix.kind == 'windows'
        shell: bash
        run: rustup component add llvm-tools-preview

      - name: Install musl C compiler
        if: matrix.kind == 'musl'
        shell: bash
        env:
          CC_ENV: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'x86_64_unknown_linux_musl' || 'aarch64_unknown_linux_musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${CC_ENV}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        if: matrix.kind == 'android'
        shell: bash
        run: |
          ndk_version="27.3.13750724"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;${ndk_version}"
          toolchain="${ANDROID_HOME}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="${toolchain}/aarch64-linux-android21-clang"
          test -x "$cc"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=${toolchain}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Package Unix artifact
        if: matrix.kind != 'windows'
        shell: bash
        run: packaging/package-release.sh --target "${{ matrix.target }}"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: packaging/package-release.ps1 -Target "${{ matrix.target }}"

      - name: Run native platform tests
        if: matrix.kind == 'windows' || matrix.kind == 'unix'
        env:
          RUSTFLAGS: ${{ matrix.kind == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      - name: Verify Unix package manifest and binary
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive_name="$(
            python3 packaging/tools/release_contract.py target \
              --target "$target" |
              jq -r .archive_name
          )"
          archive=".tmp/release/dist/${archive_name}"
          python3 packaging/tools/verify_release_archive.py \
            --archive "$archive" --target "$target"
          binary="target/${target}/release/mptunnel"
          file "$binary"
          case "$target" in
            x86_64-*) file "$binary" | grep -Eiq 'x86[-_ ]64|x86-64' ;;
            aarch64-*) file "$binary" | grep -Eiq 'aarch64|arm64' ;;
            *) echo "unsupported release architecture: $target" >&2; exit 1 ;;
          esac
          if [[ "$target" == *apple-darwin ]]; then
            inspection="$(otool -L "$binary")"
            printf '%s\n' "$inspection"
            mkdir -p .tmp/ci
            dependencies=.tmp/ci/native-dependencies.txt
            printf '%s\n' "$inspection" |
              tail -n +2 |
              sed -E 's/^[[:space:]]+([^[:space:]]+).*/\1/' \
              > "$dependencies"
            [[ -s "$dependencies" ]] || {
              echo "macOS release dependency table is unexpectedly empty" >&2
              exit 1
            }
            while IFS= read -r dependency; do
              case "$dependency" in
                /usr/lib/*|/System/Library/Frameworks/*|/System/Library/PrivateFrameworks/*)
                  ;;
                *)
                  echo "macOS release has a non-system dependency: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < "$dependencies"
          elif [[ "${{ matrix.kind }}" == android ]]; then
            readelf -h "$binary"
            inspection="$(readelf -d "$binary")"
            printf '%s\n' "$inspection"
            mkdir -p .tmp/ci
            dependencies=.tmp/ci/native-dependencies.txt
            printf '%s\n' "$inspection" |
              sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' \
              > "$dependencies"
            [[ -s "$dependencies" ]] || {
              echo "Android release dependency table is unexpectedly empty" >&2
              exit 1
            }
            while IFS= read -r dependency; do
              case "$dependency" in
                libc.so|libdl.so|liblog.so|libm.so|libandroid.so)
                  ;;
                *)
                  echo "Android release has a non-NDK/system dependency: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < "$dependencies"
          else
            readelf -h "$binary"
          fi

      - name: Verify Windows package manifest, architecture, and imports
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $target = "${{ matrix.target }}"
          $contract = python packaging/tools/release_contract.py target --target $target | ConvertFrom-Json
          $archive = Join-Path ".tmp/release/dist" $contract.archive_name
          python packaging/tools/verify_release_archive.py `
            --archive $archive --target $target
          if ($LASTEXITCODE -ne 0) { throw "Release archive verification failed" }

          $binary = "target/$target/release/mptunnel.exe"
          $hostTarget = rustc --print host-tuple
          $llvmReadobj = Join-Path (rustc --print sysroot) "lib/rustlib/$hostTarget/bin/llvm-readobj.exe"
          if (-not (Test-Path -PathType Leaf $llvmReadobj)) { throw "llvm-readobj not found at $llvmReadobj" }
          $inspection = & $llvmReadobj --file-headers --coff-imports $binary
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for $binary" }
          $inspection | Write-Output
          $expectedMachine = if ($target.StartsWith("x86_64-")) { "(?m)^Arch: x86_64$" } else { "(?m)^Arch: aarch64$" }
          if (($inspection -join "`n") -notmatch $expectedMachine) {
            throw "PE machine type does not match $target"
          }
          if (($inspection -join "`n") -match '(?i)(VCRUNTIME|MSVCP|MSVCRT|MSVCR[0-9]+|UCRTBASE|api-ms-win-crt-)[^\s]*\.dll') {
            throw "Windows release unexpectedly depends on the dynamic MSVC/UCRT runtime"
          }
          $allowedSystemDlls = @(
            "ADVAPI32.DLL",
            "BCRYPT.DLL",
            "BCRYPTPRIMITIVES.DLL",
            "CABINET.DLL",
            "CFGMGR32.DLL",
            "COMBASE.DLL",
            "COMCTL32.DLL",
            "COMDLG32.DLL",
            "CRYPT32.DLL",
            "DNSAPI.DLL",
            "GDI32.DLL",
            "IMM32.DLL",
            "IPHLPAPI.DLL",
            "KERNEL32.DLL",
            "KERNELBASE.DLL",
            "MSWSOCK.DLL",
            "NETAPI32.DLL",
            "NCRYPT.DLL",
            "NORMALIZ.DLL",
            "NTDLL.DLL",
            "OLE32.DLL",
            "OLEAUT32.DLL",
            "POWRPROF.DLL",
            "PSAPI.DLL",
            "RPCRT4.DLL",
            "SECUR32.DLL",
            "SETUPAPI.DLL",
            "SHELL32.DLL",
            "SHLWAPI.DLL",
            "USER32.DLL",
            "USERENV.DLL",
            "VERSION.DLL",
            "WINHTTP.DLL",
            "WINMM.DLL",
            "WINTRUST.DLL",
            "WS2_32.DLL",
            "WTSAPI32.DLL"
          )
          $inspectionText = $inspection -join "`n"
          $imports = [regex]::Matches(
            $inspectionText,
            '(?im)^\s*Name:\s+([^\s]+\.dll)\s*$'
          ) | ForEach-Object { $_.Groups[1].Value.ToUpperInvariant() }
          if ($imports.Count -eq 0) {
            throw "Windows release import table is unexpectedly empty"
          }
          if ($imports -contains "WINTUN.DLL") {
            throw "Wintun must remain a bundled runtime-loaded DLL, not a PE import"
          }
          foreach ($import in $imports) {
            $isApiSet = $import -match '^(API-MS-WIN-(?!CRT-)|EXT-MS-WIN-)[A-Z0-9_-]+\.DLL$'
            if (-not $isApiSet -and $allowedSystemDlls -notcontains $import) {
              throw "Windows release has a non-system import: $import"
            }
          }

      - name: Verify Unix binary version
        if: matrix.kind != 'android' && matrix.kind != 'windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/mptunnel"
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$("$binary" --version)" = "mptunnel ${version}"

      - name: Verify Windows binary version
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $binary = "target/${{ matrix.target }}/release/mptunnel.exe"
          $actual = & $binary --version
          $expected = "mptunnel $($metadata.packages[0].version)"
          if ($actual -ne $expected) {
              throw "Expected '$expected', got '$actual'"
          }

      - name: Require static musl linkage
        if: matrix.kind == 'musl'
        shell: bash
        run: file target/${{ matrix.target }}/release/mptunnel | grep -E 'statically linked|static-pie linked'

      - name: Upload ephemeral package staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.target }}
          path: |
            .tmp/release/dist/*.tar.gz
            .tmp/release/dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  publish:
    name: Publish and verify
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ephemeral package staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .tmp/ci/artifacts
          merge-multiple: true

      - name: Assemble exact public assets and version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 packaging/tools/release_contract.py write-version \
            --directory .tmp/ci/artifacts \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY"

          python3 packaging/tools/release_contract.py verify-assets \
            --directory .tmp/ci/artifacts
          python3 packaging/tools/release_contract.py assets > .tmp/ci/expected-assets.txt

      - name: Preflight existing release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          response=.tmp/ci/existing-release.json
          error=.tmp/ci/existing-release-error.txt
          pages=.tmp/ci/release-pages.json
          matches=.tmp/ci/release-matches.json
          mkdir -p .tmp/ci
          if ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$pages" 2> "$error"; then
            cat "$error" >&2
            exit 1
          fi
          jq -s --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]' "$pages" > "$matches"
          match_count="$(jq -r length "$matches")"
          if [[ "$match_count" == 0 ]]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$match_count" == 1 ]] || {
            echo "multiple releases unexpectedly use tag ${RELEASE_TAG}" >&2
            exit 1
          }
          jq '.[0]' "$matches" > "$response"

          version="${RELEASE_TAG#v}"
          expected_title="mptunnel ${version}"
          actual_tag="$(jq -er .tag_name "$response")"
          actual_title="$(jq -er .name "$response")"
          prerelease="$(jq -er .prerelease "$response")"
          state="$(jq -er 'if .draft then "draft" else "published" end' "$response")"
          immutable="$(jq -er '.immutable // false' "$response")"
          [[ "$actual_tag" == "$RELEASE_TAG" ]] || {
            echo "existing release tag mismatch: $actual_tag" >&2
            exit 1
          }
          [[ "$actual_title" == "$expected_title" ]] || {
            echo "existing release title mismatch: $actual_title" >&2
            exit 1
          }
          [[ "$prerelease" == false ]] || {
            echo "existing release is unexpectedly marked as a prerelease" >&2
            exit 1
          }
          if [[ "$state" == published && "$immutable" != true ]]; then
            echo "published release is not immutable" >&2
            exit 1
          fi

          jq -r '.assets[].name' "$response" | sort > .tmp/ci/existing-assets.txt
          if [[ -n "$(uniq -d .tmp/ci/existing-assets.txt)" ]]; then
            echo "existing release contains duplicate asset names" >&2
            exit 1
          fi
          comm -23 .tmp/ci/existing-assets.txt .tmp/ci/expected-assets.txt \
            > .tmp/ci/unexpected-existing-assets.txt
          if [[ -s .tmp/ci/unexpected-existing-assets.txt ]]; then
            echo "existing release contains unexpected assets:" >&2
            cat .tmp/ci/unexpected-existing-assets.txt >&2
            exit 1
          fi
          if [[ "$state" == published ]]; then
            diff -u .tmp/ci/expected-assets.txt .tmp/ci/existing-assets.txt
            : > .tmp/ci/missing-draft-assets.txt
          else
            comm -23 .tmp/ci/expected-assets.txt .tmp/ci/existing-assets.txt \
              > .tmp/ci/missing-draft-assets.txt
          fi
          rm -rf .tmp/ci/existing-release-download
          mkdir -p .tmp/ci/existing-release-download
          if [[ -s .tmp/ci/existing-assets.txt ]]; then
            gh release download "$RELEASE_TAG" \
              --dir .tmp/ci/existing-release-download
          fi
          if [[ "$state" == published ]]; then
            # Published artifacts are immutable release inputs, not
            # reproducible-build assertions. Native PE/Mach-O metadata and
            # runner/toolchain updates can legitimately change a fresh
            # rebuild. Verify the exact public inventory and its downloaded
            # version index, bind that index to this tag commit and repository,
            # then leave the release untouched.
            python3 packaging/tools/release_contract.py verify-assets \
              --directory .tmp/ci/existing-release-download
            cmp --silent \
              .tmp/ci/artifacts/version.json \
              .tmp/ci/existing-release-download/version.json || {
                echo "published version.json differs from this tag identity" >&2
                exit 1
              }
          else
            # A partial draft is resumable only when every already-uploaded
            # byte matches this run's payload.
            while IFS= read -r asset_name; do
              cmp --silent \
                ".tmp/ci/artifacts/${asset_name}" \
                ".tmp/ci/existing-release-download/${asset_name}" || {
                  echo "existing draft asset differs from this build: ${asset_name}" >&2
                  exit 1
                }
            done < .tmp/ci/existing-assets.txt
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Attest release archives
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            .tmp/ci/artifacts/*.tar.gz
            .tmp/ci/artifacts/*.zip

      - name: Complete matching draft payload
        if: steps.release_state.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t missing_assets < .tmp/ci/missing-draft-assets.txt
          upload_paths=()
          for asset_name in "${missing_assets[@]}"; do
            upload_paths+=(".tmp/ci/artifacts/${asset_name}")
          done
          if [[ "${#upload_paths[@]}" -gt 0 ]]; then
            gh release upload "$RELEASE_TAG" "${upload_paths[@]}"
          fi

      - name: Create owned empty draft release
        if: steps.release_state.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "mptunnel ${version}"
          gh release view "$RELEASE_TAG" \
            --json databaseId,isDraft,tagName \
            > .tmp/ci/created-release.json
          test "$(jq -r .tagName .tmp/ci/created-release.json)" = "$RELEASE_TAG"
          test "$(jq -r .isDraft .tmp/ci/created-release.json)" = true
          jq -er .databaseId .tmp/ci/created-release.json \
            > .tmp/ci/release-created-by-run

      - name: Upload owned draft payload
        if: steps.release_state.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(
            python3 packaging/tools/release_contract.py assets
          )
          release_assets=()
          for asset_name in "${asset_names[@]}"; do
            release_assets+=(".tmp/ci/artifacts/${asset_name}")
          done
          gh release upload "$RELEASE_TAG" "${release_assets[@]}"

      - name: Verify draft assets from a fresh download
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf .tmp/ci/release-download
          mkdir -p .tmp/ci/release-download
          gh release download "$RELEASE_TAG" --dir .tmp/ci/release-download
          python3 packaging/tools/release_contract.py verify-assets \
            --directory .tmp/ci/release-download
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > .tmp/ci/published-assets.txt
          diff -u .tmp/ci/expected-assets.txt .tmp/ci/published-assets.txt
          while IFS= read -r asset_name; do
            cmp --silent \
              ".tmp/ci/artifacts/${asset_name}" \
              ".tmp/ci/release-download/${asset_name}" || {
                echo "downloaded draft asset differs from this build: ${asset_name}" >&2
                exit 1
              }
          done < .tmp/ci/expected-assets.txt

      - name: Publish verified release
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > .tmp/ci/published-release.json
          test "$(jq -r .draft .tmp/ci/published-release.json)" = false
          test "$(jq -r .immutable .tmp/ci/published-release.json)" = true
          jq -r '.assets[].name' .tmp/ci/published-release.json | sort \
            > .tmp/ci/published-assets.txt
          diff -u .tmp/ci/expected-assets.txt .tmp/ci/published-assets.txt

      - name: Remove failed draft
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          marker=.tmp/ci/release-created-by-run
          [[ -f "$marker" ]] || exit 0
          created_id="$(cat "$marker")"
          [[ "$created_id" =~ ^[0-9]+$ ]] || {
            echo "invalid created-release marker" >&2
            exit 1
          }
          current=.tmp/ci/cleanup-release.json
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/${created_id}" \
            > "$current" 2>/dev/null; then
            exit 0
          fi
          current_id="$(jq -er .id "$current")"
          current_draft="$(jq -er .draft "$current")"
          current_tag="$(jq -er .tag_name "$current")"
          if [[ "$current_id" == "$created_id" \
            && "$current_tag" == "$RELEASE_TAG" \
            && "$current_draft" == true ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${created_id}"
          fi
