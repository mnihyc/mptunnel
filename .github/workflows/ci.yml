name: CI

on:
  push:
    branches:
      - diagnostic/apple-native-ip-20260913

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: .tmp/cargo-target
  PYTHONPYCACHEPREFIX: .tmp/python-cache

jobs:
  diagnose:
    name: Diagnostic Intel macOS native IP reassembly
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ignored scratch
        run: |
          mkdir -p .tmp/mac-gate .tmp/system
          echo "TMPDIR=${GITHUB_WORKSPACE}/.tmp/system" >> "$GITHUB_ENV"
      - name: Compile one native test executable
        run: cargo test --locked --all-features --target x86_64-apple-darwin --lib --no-run
      - name: Observe one focused fixture and three full suites
        shell: bash
        run: |
          set -uo pipefail
          set +e
          sysctl hw.ncpu hw.memsize
          sysctl net.inet.udp.recvspace net.inet.udp.maxdgram
          failed=0
          for index in 0 1 2 3; do
            netstat -s -p udp > ".tmp/mac-gate/${index}-udp-before.txt"
            if [[ "$index" != 0 ]]; then
              /usr/bin/time -l cargo test --locked --all-features --target x86_64-apple-darwin --lib -- --show-output > ".tmp/mac-gate/${index}-test.log" 2>&1
            else
              /usr/bin/time -l cargo test --locked --all-features --target x86_64-apple-darwin --lib 'transport::quic::stream::tests::native_ip_packets_require_ready_and_preserve_fragmented_identity' -- --exact --nocapture > ".tmp/mac-gate/${index}-test.log" 2>&1
            fi
            result=$?
            printf '%s %s\n' "$index" "$result" >> .tmp/mac-gate/results.txt
            if [[ "$result" != 0 ]]; then failed=1; fi
            netstat -s -p udp > ".tmp/mac-gate/${index}-udp-after.txt"
            cat ".tmp/mac-gate/${index}-test.log"
            diff -u ".tmp/mac-gate/${index}-udp-before.txt" ".tmp/mac-gate/${index}-udp-after.txt" || true
          done
          exit "$failed"
      - name: Retain diagnostic observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-native-ip-observations
          path: .tmp/mac-gate/
          include-hidden-files: true
          retention-days: 1
