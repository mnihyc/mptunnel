[package]
name = "mptunnel"
version = "0.1.0"
edition = "2024"
description = "Encrypted multipath proxy and tunnel"
license = "Apache-2.0"

[features]
default = []
lab-diagnostics = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.2"
hmac = "0.12"
httparse = "1.10"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
libc = "0.2"
netstack-smoltcp = "0.2.2"
percent-encoding = "2.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "0.11", default-features = false }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tun-rs = { version = "2.8.5", features = ["async", "async_framed"] }
uuid = { version = "1.23", default-features = false }
