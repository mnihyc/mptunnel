name: Release Check

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Unpublished stable tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONPYCACHEPREFIX: .tmp/python-cache

jobs:
  quality:
    name: Source quality
    uses: ./.github/workflows/release-quality-gate.yml

  version:
    name: Version and published releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate candidate
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/ci/version
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            > .tmp/ci/version/published-tags.txt
          grep --fixed-strings --line-regexp --invert-match "$CANDIDATE_TAG" \
            .tmp/ci/version/published-tags.txt \
            > .tmp/ci/version/known-tags.txt || true
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
            --jq '.[].ref | sub("^refs/tags/"; "")' > .tmp/ci/version/repository-tags.txt
          grep --fixed-strings --line-regexp --invert-match "$CANDIDATE_TAG" \
            .tmp/ci/version/repository-tags.txt \
            >> .tmp/ci/version/known-tags.txt || true
          sort -u -o .tmp/ci/version/known-tags.txt .tmp/ci/version/known-tags.txt
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python3 packaging/tools/check_release_version_gate.py \
            --candidate-tag "$CANDIDATE_TAG" \
            --package-version "$package_version" \
            --known-tags-file .tmp/ci/version/known-tags.txt

  package:
    name: Package ${{ matrix.target }}
    needs: [quality, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            kind: musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            kind: unix
          - os: ubuntu-24.04
            target: aarch64-linux-android
            kind: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install Rust binary inspection tools
        if: matrix.kind == 'windows'
        shell: bash
        run: rustup component add llvm-tools-preview

      - name: Install musl C compiler
        if: matrix.kind == 'musl'
        shell: bash
        env:
          CC_ENV: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'x86_64_unknown_linux_musl' || 'aarch64_unknown_linux_musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${CC_ENV}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        if: matrix.kind == 'android'
        shell: bash
        run: |
          ndk_version="27.3.13750724"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;${ndk_version}"
          toolchain="${ANDROID_HOME}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="${toolchain}/aarch64-linux-android21-clang"
          test -x "$cc"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=${toolchain}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Run native platform tests
        if: matrix.kind == 'windows' || matrix.kind == 'unix'
        env:
          RUSTFLAGS: ${{ matrix.kind == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.kind != 'windows'
        shell: bash
        run: packaging/package-release.sh --target "${{ matrix.target }}"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: packaging/package-release.ps1 -Target "${{ matrix.target }}"

      - name: Verify Unix package manifest and binary
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          archive_name="$(
            python3 packaging/tools/release_contract.py target \
              --target "$target" |
              jq -r .archive_name
          )"
          archive=".tmp/release/dist/${archive_name}"
          python3 packaging/tools/verify_release_archive.py \
            --archive "$archive" --target "$target"
          binary="target/${target}/release/mptunnel"
          file "$binary"
          case "$target" in
            x86_64-*) file "$binary" | grep -Eiq 'x86[-_ ]64|x86-64' ;;
            aarch64-*) file "$binary" | grep -Eiq 'aarch64|arm64' ;;
            *) echo "unsupported release architecture: $target" >&2; exit 1 ;;
          esac
          if [[ "$target" == *apple-darwin ]]; then
            inspection="$(otool -L "$binary")"
            printf '%s\n' "$inspection"
            mkdir -p .tmp/ci
            dependencies=.tmp/ci/native-dependencies.txt
            printf '%s\n' "$inspection" |
              tail -n +2 |
              sed -E 's/^[[:space:]]+([^[:space:]]+).*/\1/' \
              > "$dependencies"
            [[ -s "$dependencies" ]] || {
              echo "macOS release dependency table is unexpectedly empty" >&2
              exit 1
            }
            while IFS= read -r dependency; do
              case "$dependency" in
                /usr/lib/*|/System/Library/Frameworks/*|/System/Library/PrivateFrameworks/*)
                  ;;
                *)
                  echo "macOS release has a non-system dependency: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < "$dependencies"
          elif [[ "${{ matrix.kind }}" == android ]]; then
            readelf -h "$binary"
            inspection="$(readelf -d "$binary")"
            printf '%s\n' "$inspection"
            mkdir -p .tmp/ci
            dependencies=.tmp/ci/native-dependencies.txt
            printf '%s\n' "$inspection" |
              sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' \
              > "$dependencies"
            [[ -s "$dependencies" ]] || {
              echo "Android release dependency table is unexpectedly empty" >&2
              exit 1
            }
            while IFS= read -r dependency; do
              case "$dependency" in
                libc.so|libdl.so|liblog.so|libm.so|libandroid.so)
                  ;;
                *)
                  echo "Android release has a non-NDK/system dependency: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < "$dependencies"
          else
            readelf -h "$binary"
          fi
          if [[ "${{ matrix.kind }}" != android ]]; then
            actual="$("$binary" --version)"
            expected="mptunnel $version"
            [[ "$actual" == "$expected" ]] || {
              echo "expected '$expected', got '$actual'" >&2
              exit 1
            }
          fi

      - name: Verify Windows package manifest, architecture, and imports
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $target = "${{ matrix.target }}"
          $contract = python packaging/tools/release_contract.py target --target $target | ConvertFrom-Json
          $archive = Join-Path ".tmp/release/dist" $contract.archive_name
          python packaging/tools/verify_release_archive.py `
            --archive $archive --target $target
          if ($LASTEXITCODE -ne 0) { throw "Release archive verification failed" }

          $binary = "target/$target/release/mptunnel.exe"
          $hostTarget = rustc --print host-tuple
          $llvmReadobj = Join-Path (rustc --print sysroot) "lib/rustlib/$hostTarget/bin/llvm-readobj.exe"
          if (-not (Test-Path -PathType Leaf $llvmReadobj)) { throw "llvm-readobj not found at $llvmReadobj" }
          $inspection = & $llvmReadobj --file-headers --coff-imports $binary
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for $binary" }
          $inspection | Write-Output
          $expectedMachine = if ($target.StartsWith("x86_64-")) { "(?m)^Arch: x86_64$" } else { "(?m)^Arch: aarch64$" }
          if (($inspection -join "`n") -notmatch $expectedMachine) {
            throw "PE machine type does not match $target"
          }
          if (($inspection -join "`n") -match '(?i)(VCRUNTIME|MSVCP|MSVCRT|MSVCR[0-9]+|UCRTBASE|api-ms-win-crt-)[^\s]*\.dll') {
            throw "Windows release unexpectedly depends on the dynamic MSVC/UCRT runtime"
          }
          $allowedSystemDlls = @(
            "ADVAPI32.DLL",
            "BCRYPT.DLL",
            "BCRYPTPRIMITIVES.DLL",
            "CABINET.DLL",
            "CFGMGR32.DLL",
            "COMBASE.DLL",
            "COMCTL32.DLL",
            "COMDLG32.DLL",
            "CRYPT32.DLL",
            "DNSAPI.DLL",
            "GDI32.DLL",
            "IMM32.DLL",
            "IPHLPAPI.DLL",
            "KERNEL32.DLL",
            "KERNELBASE.DLL",
            "MSWSOCK.DLL",
            "NETAPI32.DLL",
            "NCRYPT.DLL",
            "NORMALIZ.DLL",
            "NTDLL.DLL",
            "OLE32.DLL",
            "OLEAUT32.DLL",
            "POWRPROF.DLL",
            "PSAPI.DLL",
            "RPCRT4.DLL",
            "SECUR32.DLL",
            "SETUPAPI.DLL",
            "SHELL32.DLL",
            "SHLWAPI.DLL",
            "USER32.DLL",
            "USERENV.DLL",
            "VERSION.DLL",
            "WINHTTP.DLL",
            "WINMM.DLL",
            "WINTRUST.DLL",
            "WS2_32.DLL",
            "WTSAPI32.DLL"
          )
          $inspectionText = $inspection -join "`n"
          $imports = [regex]::Matches(
            $inspectionText,
            '(?im)^\s*Name:\s+([^\s]+\.dll)\s*$'
          ) | ForEach-Object { $_.Groups[1].Value.ToUpperInvariant() }
          if ($imports.Count -eq 0) {
            throw "Windows release import table is unexpectedly empty"
          }
          if ($imports -contains "WINTUN.DLL") {
            throw "Wintun must remain a bundled runtime-loaded DLL, not a PE import"
          }
          foreach ($import in $imports) {
            $isApiSet = $import -match '^(API-MS-WIN-(?!CRT-)|EXT-MS-WIN-)[A-Z0-9_-]+\.DLL$'
            if (-not $isApiSet -and $allowedSystemDlls -notcontains $import) {
              throw "Windows release has a non-system import: $import"
            }
          }

          $actual = & $binary --version
          $expected = "mptunnel $version"
          if ($actual -ne $expected) { throw "Expected '$expected', got '$actual'" }

      - name: Require static musl linkage
        if: matrix.kind == 'musl'
        shell: bash
        run: file target/${{ matrix.target }}/release/mptunnel | grep -E 'statically linked|static-pie linked'

      - name: Upload ephemeral package proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-${{ matrix.target }}
          path: |
            .tmp/release/dist/*.tar.gz
            .tmp/release/dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  android-jni:
    name: Package Android JNI
    needs: [quality, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="27.3.13750724"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;${ndk_version}"
          ndk_root="${ANDROID_HOME}/ndk/${ndk_version}"
          test -x "${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"

      - name: Build, inspect, and package Android JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          packaging/android/build-jni-libs.sh .tmp/android/release-jni
          archive="$(packaging/android/package-jni-release.sh .tmp/android/release-jni)"
          expected="$(python3 packaging/tools/release_contract.py android-jni | jq -r .archive_name)"
          test "$archive" = ".tmp/release/dist/${expected}"

      - name: Upload ephemeral Android JNI proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-android-jni
          path: .tmp/release/dist/mptunnel-*-android-jni.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  inventory:
    name: Merged release inventory
    needs: [package, android-jni]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ephemeral package proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .tmp/ci/artifacts
          merge-multiple: true

      - name: Verify normalized public inventory
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 packaging/tools/release_contract.py write-version \
            --directory .tmp/ci/artifacts \
            --tag "$CANDIDATE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY"
          python3 packaging/tools/release_contract.py verify-assets \
            --directory .tmp/ci/artifacts
