# Exhaustive configuration reference with one runnable common-client profile.
# Active values expose local SOCKS5 and HTTP CONNECT through one TCP/QUIC MPP
# peer. Commented blocks cover every other supported TOML shape without
# opening extra listeners. Replace REPLACE_ME and the example endpoint, then run:
#
#   mptunnel --config ./config.toml --check-config
#
# Minimal client and server profiles live in ./examples. Unknown TOML keys are
# rejected. `mptunnel platform` reports host integration support; it is a
# command, not a TOML setting.

log_level = "info"
check_config = false

[service]
# Supervision owns process generations, never MPP session state.
service_mode = false
supervise = false
restart_backoff_ms = 1000
restart_max_backoff_ms = 30000
# Omit max_restarts for unlimited in-process restart attempts.
max_restarts = 10

[session]
# Established streams survive a complete carrier outage for five minutes.
# Healthy idle streams with an authenticated carrier do not consume this timer.
retention_timeout_ms = 300000

[management]
# The API is disabled while listen is empty. To enable it, replace listen with
# one or more loopback addresses and uncomment a 16..=256 byte visible-ASCII
# operator token. Dashboard serving requires the API; peer diagnosis is an
# independent, symmetric permission for authenticated MPP peers.
listen = []
# token = "replace-with-a-separate-random-operator-token"
dashboard = false
allow_peer_diagnostics = false

[resources]
# These are bounded capacity envelopes. Live transport metrics choose paths and
# scheduling; these values do not select a fixed latency or bulk mode.
max_frame_bytes = 1048576
max_payload_bytes = 1048512
max_ack_ranges = 256
max_paths = 64
max_streams = 65536
max_quic_concurrent_bidi_streams = 65536
max_stream_window_bytes = 67108864
max_repair_bytes = 67108864
max_reorder_bytes = 67108864
max_datagram_queue_bytes = 16777216
max_path_flight_bytes = 67108864
max_reliable_relay_chunk_bytes = 524288

# TCP record heartbeats and native QUIC liveness are separate carrier
# mechanisms. Both remain below the logical session-retention layer.
tcp_path_heartbeat_interval_ms = 10000
tcp_path_heartbeat_timeout_ms = 30000
quic_path_keep_alive_interval_ms = 10000
quic_path_idle_timeout_ms = 30000

[[inbounds]]
tag = "local-socks"
protocol = "socks5"
# Repeat addresses for explicit IPv4/IPv6 listeners, for example
# listen = ["127.0.0.1:1080", "[::1]:1080"]. An empty list defaults to IPv4
# loopback port 1080.
listen = ["127.0.0.1:1080"]
outbound = "edge-mpp"
# Replace outbound with `balancer = "combined-edge"` to select an MPP
# balancer. An inbound cannot set both selectors.
# balancer = "combined-edge"

# Optional username/password authentication is supported by SOCKS5 and HTTP
# local inbounds. Both values are required when the table is present.
# [inbounds.auth]
# username = "local-user"
# password = "replace-with-a-local-proxy-password"

[[inbounds]]
tag = "local-http"
# `http-connect` is accepted as a compatibility alias for `http`.
protocol = "http"
# An empty list defaults to IPv4 loopback port 8080.
listen = ["127.0.0.1:8080"]
outbound = "edge-mpp"

# Optional TUN ingress. It uses the same MPP outbound/balancer selectors as the
# local proxy inbounds. Host route/DNS setup still belongs to platform
# integration; see `mptunnel platform` and ./docs/OPERATIONS.md.
# [[inbounds]]
# tag = "local-tun"
# protocol = "tun"
# outbound = "edge-mpp"
# balancer = "combined-edge" # Alternative: remove outbound before enabling.
# name = "mptunnel"
# ipv4 = "10.88.0.1"
# disable_ipv4 = false
# ipv4_prefix = 24
# ipv4_gateway = "10.88.0.254"
# ipv6 = "fd00:88::1"
# ipv6_prefix = 64
# mtu = 1500
# disable_icmp = false
# dns_resolvers = ["1.1.1.1:53", "[2606:4700:4700::1111]:53"]
# dns_ttl_ms = 5000
#
# To run IPv6-only, set disable_ipv4 = true and remove ipv4 and ipv4_gateway.
# At least one IP family is required; IPv6 requires an MTU of at least 1280.

[[outbounds]]
tag = "edge-mpp"
protocol = "mpp"
# TCP and QUIC/UDP remain independent carriers under one MPP session.
endpoints = [
  "tcp://server.example.com:7443",
  "udp://server.example.com:7443",
]
# IPv6 literals use brackets: tcp://[2001:db8::10]:7443.
#
# Carrier URI query reference (startup hints are replaced by live evidence;
# policy flags remain operator constraints):
#   source-ip=<IP>
#   srtt-ms=<u32>                    alias: rtt-ms
#   jitter-ms=<u32>
#   rate-bps|rate-kbps|rate-mbps=<u64>, or rate=unknown|unlimited
#   datagram-payload-limit=512..65000 aliases: mtu, mtu-bytes, payload-mtu
#   backup, expensive, bulk-allowed, no-bulk, probe-only, no-udp
# `bulk` aliases bulk-allowed. Boolean flags may omit a value or use
# true/false, 1/0, yes/no, or on/off. Server bind paths reject `source-ip`, and
# udp:// paths cannot set no-udp=true.
path_probe_interval_ms = 10000
path_probe_timeout_ms = 2000

[outbounds.performance]
# Optional repair traffic is evidence-gated and capped by this operator budget.
extra_traffic_hint_percent = 5

[outbounds.security]
# Intentionally invalid: replace with at least 32 random bytes or a random UUID.
secret = "REPLACE_ME"
# Supported record ciphers are aes-256-gcm (alias aes256-gcm) and
# chacha20-poly1305. QUIC carrier encryption remains TLS 1.3.
cipher = "aes-256-gcm"
auth_freshness_window_seconds = 300

# A second MPP leaf can be combined with edge-mpp by the combined-edge routing
# example below. Its probe policy must match the other members.
# [[outbounds]]
# tag = "edge-mpp-secondary"
# protocol = "mpp"
# endpoints = [
#   "tcp://secondary.example.com:7443?backup=true&expensive=true",
#   "udp://secondary.example.com:7443?backup=true&expensive=true",
# ]
# path_probe_interval_ms = 10000
# path_probe_timeout_ms = 2000
#
# [outbounds.performance]
# extra_traffic_hint_percent = 5
#
# [outbounds.security]
# secret = "REPLACE_ME"
# cipher = "chacha20-poly1305"
# auth_freshness_window_seconds = 300

# Optional server-side MPP inbound
#
# Uncomment this block and one egress below to run a symmetric node. An MPP
# inbound selects one egress leaf with outbound, or one sequence/random egress
# group with balancer. It cannot select an MPP outbound or set both selectors.
# [[inbounds]]
# tag = "mpp-listener"
# protocol = "mpp"
# endpoints = [
#   "tcp://0.0.0.0:7443",
#   "udp://0.0.0.0:7443",
# ]
# outbound = "direct-egress"
# balancer = "egress-sequence" # Alternative: remove outbound before enabling.
#
# [inbounds.performance]
# extra_traffic_hint_percent = 5
#
# [inbounds.security]
# secret = "REPLACE_ME"
# cipher = "aes-256-gcm"
# auth_freshness_window_seconds = 300

# Server egress leaves
#
# Direct egress uses the system resolver when dns is omitted or resolvers is
# empty. Omit bind_ip to let the OS select a source address; set it to bind all
# target connections to one local source IP.
# [[outbounds]]
# tag = "direct-egress"
# protocol = "direct"
# bind_ip = "192.0.2.10"
# connect_timeout_ms = 10000
#
# [outbounds.dns]
# resolvers = ["1.1.1.1:53", "[2606:4700:4700::1111]:53"]
# strategy = "ipv4-and-ipv6"
# timeout_ms = 1500
#
# DNS strategies: ipv4-then-ipv6, ipv6-then-ipv4, ipv4-only, ipv6-only,
# ipv4-and-ipv6, and ipv6-and-ipv4. Underscore spellings are compatibility
# aliases. DNS and connect timeouts must be nonzero.
#
# Relay through a no-auth SOCKS5 proxy. TCP CONNECT and UDP ASSOCIATE are
# supported when the upstream implements them. The domain is resolved by the
# proxy; upstream SOCKS5 authentication is not currently configurable.
# [[outbounds]]
# tag = "socks5-egress"
# protocol = "socks5"
# proxy = "127.0.0.1:1080"
# connect_timeout_ms = 10000
#
# Plain HTTP CONNECT carries TCP targets. Proxy authentication and TLS are not
# currently configurable. The domain is resolved by the upstream proxy.
# [[outbounds]]
# tag = "http-egress"
# protocol = "http-connect"
# proxy = "127.0.0.1:8080"
# connect_timeout_ms = 10000
#
# CONNECT-UDP carries UDP targets and uses ordinary CONNECT for TCP targets.
# [[outbounds]]
# tag = "http-connect-udp-egress"
# protocol = "http-connect-udp"
# proxy = "127.0.0.1:8080"
# connect_timeout_ms = 10000

# Routing policies
#
# Local SOCKS5/HTTP/TUN inbounds may select combined-edge. The MPP inbound may
# instead select egress-sequence or egress-random. Balancers contain leaf
# outbounds only; routing balancers cannot be nested.
# [routing]
#
# combined-mpp forms one MPP path set from several MPP outbounds. Members must
# use identical probe intervals/timeouts. This performance table overrides the
# member performance values for the combined group.
# [[routing.balancers]]
# tag = "combined-edge"
# strategy = "combined-mpp"
# outbounds = ["edge-mpp", "edge-mpp-secondary"]
#
# [routing.balancers.performance]
# extra_traffic_hint_percent = 5
#
# sequence tries each egress in configured order for a new target connection.
# [[routing.balancers]]
# tag = "egress-sequence"
# strategy = "sequence"
# outbounds = ["direct-egress", "socks5-egress"]
#
# random rotates the first egress choice per flow, then falls back through the
# remaining members.
# [[routing.balancers]]
# tag = "egress-random"
# strategy = "random"
# outbounds = ["direct-egress", "socks5-egress"]
