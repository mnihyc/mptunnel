# Generate one random credential into ./mpp-credential.key and transfer that
# file securely to both endpoints. Keep it outside source control.
#
# Linux/macOS: umask 077; openssl rand -out mpp-credential.key 32
# PowerShell:   (New-Guid).Guid | Set-Content -NoNewline mpp-credential.key
# Transport protection uses a different raw 32-byte file shared by the two
# endpoints: umask 077; openssl rand -out mpp-transport.key 32

# L4 is the default. The separate experimental L3 profile is documented in
# config.reference.toml.
# forwarding_mode = "l4"

[logging]
level = "info"

[[credentials]]
credential_id = "home-client"
principal_id = "home"
secret = { from = "file", path = "mpp-credential.key" }

[session]
# Keep target sockets for reattachment and bound graceful TCP carrier retirement.
retention_timeout_ms = 300000

[dns]
default = "system"

[[dns.servers]]
name = "system"
protocol = "system"

[[dns.policies]]
name = "system"
servers = ["system"]

# The management API is optional, loopback-only, and requires a separate random
# operator token when enabled.
# [management]
# listen = ["127.0.0.1:7600"]
# token = { from = "file", path = "management-token.key" }
# dashboard = true
# allow_peer_diagnostics = false

[[inbounds]]
name = "mpp-listener"
protocol = "mpp"
paths = [
  { name = "path-1", endpoint = "tcp://0.0.0.0:7443" },
  { name = "path-2", endpoint = "quic://0.0.0.0:7443" },
]
outbound = "direct-egress"
dns_policy = "system"

[inbounds.security]
credential_ids = ["home-client"]
tls_certificate_chain = { from = "file", path = "server-cert.pem" }
tls_private_key = { from = "file", path = "server-key.pem" }
# This endpoint-wide secret is not an MPP client credential.
transport_secret = { from = "file", path = "mpp-transport.key" }
# Direct-paste alternative (`openssl rand -hex 32`); use the same value on both peers:
# transport_secret = { from = "hex", value = "REPLACE_WITH_64_HEX_DIGITS" }

[[outbounds]]
name = "direct-egress"
protocol = "direct"
# Omit all bind fields for OS-selected IPv4 and IPv6 sources. Legacy bind_ip is
# single-family and cannot be combined with bind_ipv4 or bind_ipv6.
# bind_ip = "192.0.2.10"
# Prefer one or both explicit-family fields; only configured families are then
# eligible. A temporarily absent address fails a dial, not the node process.
# bind_ipv4 = "192.0.2.10"
# bind_ipv6 = "2001:db8::10"
# Replace the global `system` server with named UDP/TCP/DoT/DoH/DoQ servers
# for explicit or encrypted resolution.

# To relay through SOCKS5, change the MPP inbound reference above to
# `outbound = "socks5-egress"`, then uncomment this complete block.
# [[outbounds]]
# name = "socks5-egress"
# protocol = "socks5"
# endpoint = "127.0.0.1:1080"
# connect_timeout_ms = 10000
# Canonical target domains are carried to the SOCKS5 proxy unless an
# IP-dependent destination ACL requires evidence from the selected DNS policy.

# Plain HTTP CONNECT relays TCP. Use SOCKS5 when a proxy must relay
# both TCP and UDP.
# [[outbounds]]
# name = "http-egress"
# protocol = "http-connect"
# endpoint = "127.0.0.1:8080"
# connect_timeout_ms = 10000

# For ordered direct-to-relay fallback, uncomment the SOCKS5 block, replace
# `outbound = "direct-egress"` above with `balancer = "egress-fallback"`, and
# uncomment this routing block. An inbound must not set both references.
# [routing]
#
# [[routing.balancers]]
# name = "egress-fallback"
# strategy = "ordered-failover"
# members = [{ outbound = "direct-egress" }, { outbound = "socks5-egress" }]
# health = { failure_threshold = 3, recovery_threshold = 2, initial_backoff_ms = 1000, maximum_backoff_ms = 60000 }
# probe = { target = "192.0.2.1:443", interval_ms = 10000, timeout_ms = 2000 }
